<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토크와 평형 연습</title>
<style>
:root{--bg:#f6efd8;--card:#fffaf0;--ink:#2b2038;--sub:#6f6380;--line:#e0d3b0;--acc:#6b4c9a;--accbg:#ece3f7;--ok:#2e7d4f;--okbg:#e0f2e6;--no:#b3261e;--nobg:#fbe7e5;--rod:#9a86b8;--box:#f0dc9a;--gnd:#d9c9a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121f;--card:#221a2e;--ink:#f1e8d0;--sub:#b3a6c8;--line:#3a2e4d;--acc:#c7a8f0;--accbg:#35294a;--ok:#6fd48b;--okbg:#17321f;--no:#ff8a80;--nobg:#3a1c1a;--rod:#6e5a8c;--box:#e8d28a;--gnd:#2d2340}}
:root[data-theme="dark"]{--bg:#17121f;--card:#221a2e;--ink:#f1e8d0;--sub:#b3a6c8;--line:#3a2e4d;--acc:#c7a8f0;--accbg:#35294a;--ok:#6fd48b;--okbg:#17321f;--no:#ff8a80;--nobg:#3a1c1a;--rod:#6e5a8c;--box:#e8d28a;--gnd:#2d2340}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.q{font-size:16px;margin:0 0 8px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:inherit}
.st{stroke:var(--ink);stroke-width:1.6;fill:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:left}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;font:inherit;font-size:16px;font-weight:700;padding:13px;border-radius:10px;border:0;cursor:pointer}
.main{background:var(--acc);color:#fff}
.main:disabled{opacity:.4}
.alt{background:var(--accbg);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .main{color:#1d1230}}
#res{display:none}
#res .v{font-weight:700;font-size:18px;margin:0 0 6px}
#res ol{margin:6px 0 0;padding-left:20px}
#res li{margin-bottom:4px}
.good{color:var(--ok)}.bad{color:var(--no)}
.eq{background:var(--accbg);border-radius:8px;padding:8px 10px;margin:6px 0}
</style>
</head>
<body>
<main>
<h1>따라큐의 탈을 지켜라</h1>
<div class="card">
<p class="q" id="qtext"></p>
<svg id="fig" viewBox="0 0 360 340" role="img" aria-label="막대 그림"></svg>
<div class="opts" id="opts"></div>
<div class="row">
<button class="btn alt" id="newBtn">새 문제</button>
<button class="btn main" id="chkBtn" disabled>확인</button>
</div>
</div>
<div class="card" id="res"></div>
</main>

  h+='<line class="st" x1="'+x0+'" y1="'+dy+'" x2="'+px+'" y2="'+dy+'"/><line class="st" x1="'+x0+'" y1="'+(dy-6)+'" x2="'+x0+'" y2="'+(dy+6)+'"/><line class="st" x1="'+px+'" y1="'+(dy-6)+'" x2="'+px+'" y2="'+(dy+6)+'"/>';
  h+='<text x="'+((x0+px)/2)+'" y="'+(dy-8)+'" font-size="15" font-style="italic" text-anchor="middle">'+lab(a)+'</text>';
  h+='<line class="st" x1="'+px+'" y1="'+dy+'" x2="'+x1+'" y2="'+dy+'"/><line class="st" x1="'+x1+'" y1="'+(dy-6)+'" x2="'+x1+'" y2="'+(dy+6)+'"/>';
  h+='<text x="'+((px+x1)/2)+'" y="'+(dy-8)+'" font-size="15" font-style="italic" text-anchor="middle">'+lab(b)+'</text>';
  $('fig').innerHTML=h;
}
function render(){
  $('qtext').textContent='그림과 같이 무게가 '+P.m+' N인 따라큐의 탈이 원통형 막대에 매달려 있다. 로사와 로이가 탈을 구하기 위해 막대를 찾으러 떠난 동안 떨어지지 않도록 수평이 유지되기 위한 막대의 무게 W의 값은?';
  draw();
  var o=$('opts');o.innerHTML='';
  P.choices.forEach(function(v,i){
    var bt=document.createElement('button');bt.className='opt';bt.type='button';
    bt.textContent=['①','②','③','④','⑤'][i]+' '+v+' N';
    bt.onclick=function(){
      if(done)return;sel=v;
      [].forEach.call(o.children,function(c){c.classList.remove('sel')});
      bt.classList.add('sel');$('chkBtn').disabled=false;
    };
    bt.dataset.v=v;o.appendChild(bt);
  });
  $('res').style.display='none';$('chkBtn').disabled=true;sel=null;done=false;
}
function check(){
  if(sel===null||done)return;done=true;
  var ok=sel===P.w,a=P.a,b=P.b,d=(b-a)/2;
  [].forEach.call($('opts').children,function(c){
    var v=Number(c.dataset.v);
    if(v===P.w)c.classList.add('right');
    else if(v===sel)c.classList.add('wrong');
    c.classList.remove('sel');
  });
  var r=$('res');r.style.display='block';
  r.innerHTML=
   '<p class="v '+(ok?'good':'bad')+'">'+(ok?'정답입니다! 🎉':'오답입니다. 정답은 '+P.w+' N')+'</p>'+
   '<ol>'+
   '<li>막대는 균일하므로 무게중심이 중앙에 있습니다. 막대 전체 길이는 '+lab(a)+' + '+lab(b)+' = '+(a+b)+'L 이고, 균일한 막대의 무게중심은 중앙(왼쪽 끝에서 '+((a+b)/2)+'L)에 있습니다.</li>'+
   '<li>끈이 매달린 점(회전축)에서 무게중심까지 거리는 '+((a+b)/2)+'L − '+a+'L = <b>'+d+'L</b> 입니다.</li>'+
   '<li>회전축 기준으로 토크 평형:<div class="eq">반시계 토크 = 시계 토크<br>'+P.m+' N × '+a+'L = W × '+d+'L</div></li>'+
   '<li>W = '+P.m+' × '+a+' ÷ '+d+' = <b>'+P.w+' N</b></li>'+
   '</ol>';
  $('chkBtn').disabled=true;
  r.scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('newBtn').onclick=function(){P=gen();render();window.scrollTo(0,0)};
$('chkBtn').onclick=check;
P={a:1,b:3,m:20,w:20,choices:[5,10,20,30,60]};
render();
})();
</script>
</body>
</html>
