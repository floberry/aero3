<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타원 궤도 연습 · 케플러 법칙</title>
<style>
  :root{
    --bg:#1c2439;
    --panel:#232c47;
    --panel-2:#28324f;
    --ink:#dfe3f0;
    --ink-soft:#9aa3c0;
    --line:#39456a;
    --sun:#f0b53c;
    --orbit:#9fb0d4;
    --accent:#5b8dee;
    --accent-ink:#081022;
    --mint:#3fb0a6;
    --ok:#5fd39a;
    --no:#ff8a8a;
    --bubble:#2a3355;
    --shadow:0 2px 10px rgba(3,6,20,.3);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 32px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  h1{font-size:17px;margin:0;letter-spacing:-.02em}
  .score{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}

  .stem{font-size:15px;margin:0 0 10px;line-height:1.55}
  .stem b{font-weight:700}

  .figure{position:relative;background:#05070f;border-radius:10px;padding:0;overflow:hidden}
  .figure img.space-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .figure svg{position:relative;display:block;width:100%;height:auto}
  svg{display:block;width:100%;height:auto}

  .given{margin:10px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-soft)}
  .given li{position:relative;padding-left:14px;margin:2px 0}
  .given li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink-soft);opacity:.6}

  .students{display:flex;flex-direction:column;gap:8px}
  .student{display:flex;gap:9px;align-items:flex-start}
  .tag{flex:0 0 auto;width:36px;height:36px;border-radius:50%;overflow:hidden;margin-top:2px;
       border:2px solid var(--mint);box-shadow:var(--shadow)}
  .tag img{width:100%;height:100%;object-fit:cover;display:block}
  .bubble{background:var(--bubble);border-radius:12px;border-top-left-radius:3px;padding:9px 11px;font-size:14.5px;flex:1}
  .bubble .who{display:block;font-size:12px;font-weight:700;color:var(--mint);margin-bottom:2px}

  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:2px}
  .choices button{
    font:inherit;font-size:15px;color:var(--ink);background:var(--panel-2);
    border:1.5px solid var(--line);border-radius:11px;padding:11px 8px;cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .choices button:last-child:nth-child(odd){grid-column:1 / -1}
  .choices button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .choices button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .choices button[disabled]{cursor:default;opacity:.75}
  .choices button.mark-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent);opacity:1}
  .choices button.mark-no{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent);opacity:1}

  .actions{display:flex;gap:8px;margin-top:12px}
  .actions button{flex:1;font:inherit;font-size:15px;font-weight:600;padding:13px 10px;border-radius:11px;cursor:pointer;border:1.5px solid var(--accent)}
  #check{background:var(--accent);color:var(--accent-ink)}
  #next{background:transparent;color:var(--accent)}
  .actions button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  #result{display:none}
  #result.show{display:block}
  .verdict{font-size:16px;font-weight:700;margin:0 0 8px}
  .verdict.ok{color:var(--ok)}
  .verdict.no{color:var(--no)}
  .sol{border-top:1px solid var(--line);padding-top:9px;margin-top:9px;font-size:14px}
  .sol:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .sol h3{margin:0 0 3px;font-size:14px;display:flex;align-items:center;gap:6px}
  .sol h3 .mk{font-weight:700}
  .sol h3 .mk.y{color:var(--ok)}
  .sol h3 .mk.n{color:var(--no)}
  .sol p{margin:0;color:var(--ink-soft);line-height:1.62}
  .law{font-size:12.5px;color:var(--ink-soft);margin-top:12px;padding-top:9px;border-top:1px dashed var(--line)}
  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>타원 궤도와 케플러 법칙 연습</h1>
    <div class="score" id="score">0 / 0</div>
  </header>

  <section class="card">
    <p class="stem">그림은 지구가 태양을 한 초점으로 하는 타원 궤도를 따라 운동하는 것에 대해 머피, 브랜드, 쿠퍼가 대화하는 모습을 나타낸 것이다.</p>
    <div class="figure" id="figure"></div>
    <ul class="given" id="given"></ul>
  </section>

  <section class="card">
    <div class="students" id="students"></div>
  </section>

  <section class="card">
    <p class="stem" style="margin-bottom:10px">제시한 내용이 옳은 사람만을 있는 대로 고른 것은?</p>
    <div class="choices" id="choices"></div>
    <div class="actions">
      <button id="check">확인</button>
      <button id="next">새 문제</button>
    </div>
  </section>

  <section class="card" id="result" aria-live="polite">
    <p class="verdict" id="verdict"></p>
    <div id="solutions"></div>
    <p class="law">케플러 1법칙 — 지구는 태양을 한 초점으로 하는 타원 궤도를 돈다. 2법칙 — 태양과 지구를 잇는 선이 같은 시간 동안 쓸고 지나간 면적은 같다. 3법칙 — 공전 주기의 제곱은 긴반지름의 세제곱에 비례한다.</p>
  </section>

  <footer>새 문제를 누를 때마다 그림·기호·진술이 모두 바뀝니다.</footer>
</div>

  const $ = id => document.getElementById(id);
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

  let P = null, picked = null, answered = false, total = 0, correct = 0;

  /* ---------- 문제 생성 ---------- */

  function makeGeometry(){
    const e = 0.42 + Math.random()*0.28;          // 이심률
    const sunSide = Math.random() < 0.5 ? -1 : 1;  // 태양이 왼쪽/오른쪽 초점
    const dir = Math.random() < 0.5 ? 1 : -1;      // 공전 방향
    const startT = sunSide < 0 ? Math.PI : 0;      // 근일점의 매개변수 각
    const a = 108;
    return {
      e, sunSide, dir, a,
      b:a*Math.sqrt(1-e*e), c:a*e,
      cx:180, cy:150,
      startT, midT: startT + dir*Math.PI/2, endT: startT + dir*Math.PI,
      near:'p', mid:'q', far:'r'             // 근일점 / 궤도상의 점 / 원일점
    };
  }

  // 태양으로부터의 거리 순위 (작을수록 가까움)
  function rank(g, label){ return label===g.near ? 0 : (label===g.mid ? 1 : 2); }
  function dtext(g, label){ return label===g.near ? "a−c" : (label===g.mid ? "a" : "a+c"); }

  function cmpWord(t){ return t==='gt' ? '커' : '작아'; }

  // 각 진술 생성기: {text, ok, why}
  const gens = [
    // 1. 케플러 2법칙 — 구간 소요 시간
    function(g){
      const t = rnd(['same','gt','lt']);
      const text = t==='same'
        ? `지구가 ${g.near}에서 ${g.mid}까지 운동하는 데 걸리는 시간은 ${g.mid}에서 ${g.far}까지 운동하는 데 걸리는 시간과 같아.`
        : `지구가 ${g.near}에서 ${g.mid}까지 운동하는 데 걸리는 시간은 ${g.mid}에서 ${g.far}까지 운동하는 데 걸리는 시간보다 ${cmpWord(t)}.`;
      return {text, ok: t==='lt',
        why:`태양은 중심 O가 아니라 ${g.near} 쪽 초점에 있다. 태양과 지구를 잇는 선이 쓸고 지나간 넓이는 ${g.near}→${g.mid} 구간이 ¼πab − ½bc, ${g.mid}→${g.far} 구간이 ¼πab + ½bc 이다. 면적 속도가 일정하므로 넓이가 작은 ${g.near}→${g.mid} 구간이 시간이 더 짧다.`};
    },
    // 2. 속력 비교
    function(g){
      const two = shuffle([g.near,g.mid,g.far]).slice(0,2);
      const [x,y] = two, t = rnd(['same','gt','lt']);
      const text = t==='same'
        ? `지구의 속력은 ${x}에서와 ${y}에서가 같아.`
        : `지구의 속력은 ${x}에서가 ${y}에서보다 ${cmpWord(t)}.`;
      const truth = rank(g,x) < rank(g,y) ? 'gt' : 'lt';
      return {text, ok: t===truth,
        why:`태양으로부터의 거리는 ${g.near}(${dtext(g,g.near)}) < ${g.mid}(${dtext(g,g.mid)}) < ${g.far}(${dtext(g,g.far)})이다. 면적 속도가 일정하려면 태양에 가까울수록 빠르게 움직여야 하므로 속력은 ${x}에서가 ${y}에서보다 ${truth==='gt'?'크':'작'}다.`};
    },
    // 3. 가속도 크기
    function(g){
      if(Math.random()<0.45){
        return {text:`지구가 운동하는 동안 지구의 가속도의 크기는 일정해.`, ok:false,
          why:`지구에 작용하는 힘은 태양의 중력뿐이고 그 크기는 거리의 제곱에 반비례한다. 궤도가 타원이라 태양까지의 거리가 계속 변하므로 가속도의 크기도 계속 변한다(${g.near}에서 최대, ${g.far}에서 최소). 일정한 것은 가속도가 아니라 면적 속도와 역학적 에너지다.`};
      }
      const two = shuffle([g.near,g.mid,g.far]).slice(0,2);
      const [x,y] = two, t = rnd(['same','gt','lt']);
      const text = t==='same'
        ? `지구의 가속도의 크기는 ${x}에서와 ${y}에서가 같아.`
        : `지구의 가속도의 크기는 ${x}에서가 ${y}에서보다 ${cmpWord(t)}.`;
      const truth = rank(g,x) < rank(g,y) ? 'gt' : 'lt';
      return {text, ok: t===truth,
        why:`가속도의 크기는 a = GM/r²로 태양에 가까울수록 크다. 태양까지의 거리가 ${x}(${dtext(g,x)}), ${y}(${dtext(g,y)})이므로 가속도의 크기는 ${x}에서가 ${y}에서보다 ${truth==='gt'?'크':'작'}다.`};
    },
    // 4. 힘·가속도의 방향
    function(g){
      const v = rnd(['sun','vel']);
      if(v==='sun') return {text:`지구가 운동하는 동안 지구의 가속도의 방향은 항상 태양을 향해.`, ok:true,
        why:`지구에 작용하는 알짜힘은 태양이 당기는 중력뿐이고, 가속도의 방향은 알짜힘의 방향과 같다. 따라서 가속도는 항상 태양 쪽을 향한다.`};
      return {text:`지구가 운동하는 동안 지구의 가속도의 방향은 항상 운동 방향과 같아.`, ok:false,
        why:`가속도는 항상 태양을 향한다. 운동 방향과 같다면 속력만 계속 빨라질 뿐 궤도가 휘지 않는다. 가속도와 속도 방향이 수직이 되는 곳은 ${g.near}와 ${g.far}뿐이다.`};
    },
    // 5. 면적 속도
    function(g){
      const t = rnd(['same','diff']);
      if(t==='same') return {text:`태양과 지구를 잇는 선이 단위 시간 동안 쓸고 지나간 면적은 ${g.near} 부근에서와 ${g.far} 부근에서가 같아.`, ok:true,
        why:`케플러 2법칙(면적 속도 일정 법칙)이다. 궤도 어느 곳에서든 같은 시간 동안 쓸고 지나간 면적은 같다.`};
      return {text:`태양과 지구를 잇는 선이 단위 시간 동안 쓸고 지나간 면적은 ${g.near} 부근에서가 ${g.far} 부근에서보다 커.`, ok:false,
        why:`면적 속도는 항상 일정하다. ${g.near} 부근에서 속력이 더 빠른 것은 태양까지의 거리가 짧아진 만큼을 보상해 면적을 같게 유지하기 위해서다.`};
    },
    // 6. 등속 원운동
    function(g){
      const v = rnd(['const','zero','period']);
      if(v==='const') return {text:`지구가 태양을 중심으로 하는 원 궤도를 따라 운동한다면 지구는 등속 원운동을 해.`, ok:true,
        why:`원 궤도라면 태양까지의 거리가 일정해 중력의 크기가 일정하고, 그 방향이 항상 운동 방향과 수직이라 속력을 바꾸지 못한다. 따라서 속력이 일정한 등속 원운동을 한다.`};
      if(v==='zero') return {text:`지구가 등속 원운동을 한다면 지구에 작용하는 알짜힘은 0이야.`, ok:false,
        why:`등속 원운동은 속력만 일정할 뿐 속도의 방향이 계속 변하는 가속 운동이다. 원의 중심을 향하는 구심력(중력)이 알짜힘으로 작용하며, 그 크기는 mv²/r로 0이 아니다.`};
      return {text:`지구가 등속 원운동을 한다면 지구의 가속도의 방향은 일정해.`, ok:false,
        why:`등속 원운동에서 가속도는 항상 원의 중심을 향하는 구심 가속도다. 크기는 v²/r로 일정하지만 방향은 지구가 돌면서 계속 바뀐다.`};
    },
    // 7. 인공위성의 운동
    function(g){
      const v = rnd(['dir','radius']);
      if(v==='dir') return {text:`지구 주위를 원 궤도로 도는 인공위성이 받는 구심력의 방향은 위성의 운동 방향과 같아.`, ok:false,
        why:`구심력은 항상 원의 중심을 향하므로 접선 방향인 운동 방향과 수직이다. 운동 방향과 같다면 속력이 계속 빨라져 원 궤도를 유지할 수 없다.`};
      return {text:`지구 주위를 원 궤도로 도는 두 인공위성 중 궤도 반지름이 큰 위성의 공전 주기가 더 길어.`, ok:true,
        why:`케플러 3법칙 T² ∝ r³이 인공위성에도 그대로 적용된다. 궤도 반지름이 클수록 주기가 길고 공전 속력은 느리다.`};
    },
    // 7. 궤도상의 점에서 태양까지의 거리
    function(g){
      const t = Math.random()<0.5;
      return {
        text: t ? `${g.mid}에서 태양까지의 거리는 타원 궤도의 긴반지름의 길이와 같아.`
                : `${g.mid}에서 태양까지의 거리는 타원 궤도의 짧은반지름의 길이와 같아.`,
        ok: t,
        why:`타원 위의 점에서 두 초점까지의 거리의 합은 2a로 일정하다. ${g.mid}는 단축의 끝이라 두 초점까지의 거리가 서로 같으므로 각각 a, 즉 긴반지름의 길이와 같다.`};
    },
    // 8. 케플러 3법칙
    function(g){
      const t = Math.random()<0.5;
      return {
        text: t ? `이 지구의 공전 주기의 제곱은 타원 궤도의 긴반지름의 세제곱에 비례해.`
                : `이 지구의 공전 주기는 타원 궤도의 긴반지름의 세제곱에 비례해.`,
        ok: t,
        why:`케플러 3법칙은 T² ∝ a³이다. 주기 자체가 a³에 비례하는 것이 아니라 주기의 제곱이 긴반지름의 세제곱에 비례한다.`};
    },
    // 9. 케플러 1법칙 (일반 진술)
    function(g){
      return {text:`모든 행성은 태양을 한 초점으로 하는 타원 궤도를 따라 운동해.`, ok:true,
        why:`케플러 1법칙(타원 궤도 법칙)이다. 모든 행성은 원이 아니라 태양을 한 초점으로 하는 타원 궤도를 그리며 공전한다.`};
    },
    // 10. 케플러 2법칙 (일반 진술)
    function(g){
      return {text:`행성이 타원 궤도를 돌면서 일정한 시간 동안 태양과 잇는 직선이 쓸고 간 면적은 항상 같아.`, ok:true,
        why:`케플러 2법칙(면적 속도 일정 법칙)이다. 태양에 가까울 때는 빠르게, 멀 때는 느리게 움직여 같은 시간 동안 쓸고 간 면적을 항상 같게 유지한다.`};
    }
  ];

  const SUBSETS = [[0],[1],[2],[0,1],[0,2],[1,2],[0,1,2]];
  const NAMES = ['머피','브랜드','쿠퍼'];
  const AVATARS = [IMG.murph, IMG.brand, IMG.cooper];
  const NUMS = ['①','②','③','④','⑤'];
  const key = s => s.join(',');
  const subLabel = s => s.map(i=>NAMES[i]).join(', ');

  function newProblem(){
    const g = makeGeometry();
    let sts;
    do{
      sts = shuffle(gens).slice(0,3).map(f=>f(g));
    }while(sts.every(s=>!s.ok));   // 정답이 없는 경우 재생성

    const truth = sts.map((s,i)=>s.ok?i:-1).filter(i=>i>=0);
    const others = shuffle(SUBSETS.filter(s=>key(s)!==key(truth))).slice(0,4);
    const options = [truth,...others].sort((x,y)=>SUBSETS.findIndex(s=>key(s)===key(x))-SUBSETS.findIndex(s=>key(s)===key(y)));
    return {g, sts, truth, options};
  }

  /* ---------- 그림 ---------- */

  function pt(g,t){ return [g.cx + g.a*Math.cos(t), g.cy - g.b*Math.sin(t)]; }

  function drawFigure(g){
    const [px,py] = pt(g,g.startT), [mx,my] = pt(g,g.midT), [fx,fy] = pt(g,g.endT);
    const sx = g.cx + g.sunSide*g.c, sy = g.cy;
    const pl = pt(g, g.startT + g.dir*0.75);           // 지구 위치
    const ang = g.startT + g.dir*0.75;
    const tx = -g.a*Math.sin(ang)*g.dir, ty = g.b*Math.cos(ang)*g.dir;
    const deg = Math.atan2(-ty, tx)*180/Math.PI;
    const labelSide = x => x < g.cx ? -1 : 1;
    const qBelow = my > g.cy;      // q가 위/아래 어느 쪽 꼭짓점인지 — 라벨을 항상 캔버스 안쪽으로
    const qLabelY = qBelow ? Math.min(my+18, 292) : Math.max(my-13, 12);
    const plBelow = pl[1] < g.cy ? false : true;

    return `<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="우주 배경 위 태양을 한 초점으로 하는 타원 궤도와 지구">
      <defs>
        <clipPath id="sunClip"><circle cx="${sx}" cy="${sy}" r="13"/></clipPath>
        <clipPath id="earthClip"><circle cx="${pl[0].toFixed(1)}" cy="${pl[1].toFixed(1)}" r="10"/></clipPath>
        <style>
          .lbl{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;font-style:normal;font-weight:500;letter-spacing:.01em}
        </style>
      </defs>
      <image href="${IMG.space}" xlink:href="${IMG.space}" x="0" y="0" width="360" height="300" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0" y="0" width="360" height="300" fill="#04060d" opacity=".12"/>

      <ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.a}" ry="${g.b.toFixed(1)}" fill="none" stroke="#f5f7ff" stroke-width="1.5" stroke-dasharray="6 5" opacity=".85"/>
      <line x1="${g.cx-g.a}" y1="${g.cy}" x2="${g.cx+g.a}" y2="${g.cy}" stroke="#f5f7ff" stroke-width="1" stroke-dasharray="4 4" opacity=".4"/>
      <line x1="${g.cx}" y1="${(g.cy-g.b).toFixed(1)}" x2="${g.cx}" y2="${(g.cy+g.b).toFixed(1)}" stroke="#f5f7ff" stroke-width="1" stroke-dasharray="4 4" opacity=".4"/>

      <image href="${IMG.sun}" xlink:href="${IMG.sun}" x="${sx-13}" y="${sy-13}" width="26" height="26" clip-path="url(#sunClip)" preserveAspectRatio="xMidYMid slice"/>
      <text class="lbl" x="${sx}" y="${sy+23}" text-anchor="middle" font-size="9.5" fill="#f5f7ff">태양</text>
      <circle cx="${g.cx}" cy="${g.cy}" r="2.4" fill="#f5f7ff"/>
      <text class="lbl" x="${g.cx + (g.sunSide<0?11:-11)}" y="${g.cy+15}" text-anchor="middle" font-size="12" fill="#f5f7ff">O</text>

      <circle cx="${px}" cy="${py}" r="4.5" fill="#f5f7ff"/>
      <text class="lbl" x="${px + labelSide(px)*16}" y="${py+4}" text-anchor="middle" font-size="15" fill="#f5f7ff">${g.near}</text>
      <circle cx="${fx}" cy="${fy}" r="4.5" fill="#f5f7ff"/>
      <text class="lbl" x="${fx + labelSide(fx)*16}" y="${fy+4}" text-anchor="middle" font-size="15" fill="#f5f7ff">${g.far}</text>
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="4.5" fill="#f5f7ff"/>
      <text class="lbl" x="${mx.toFixed(1)}" y="${qLabelY.toFixed(1)}" text-anchor="middle" font-size="15" fill="#f5f7ff">${g.mid}</text>

      <image href="${IMG.earth}" xlink:href="${IMG.earth}" x="${(pl[0]-10).toFixed(1)}" y="${(pl[1]-10).toFixed(1)}" width="20" height="20" clip-path="url(#earthClip)" preserveAspectRatio="xMidYMid slice"/>
      <text class="lbl" x="${pl[0].toFixed(1)}" y="${(pl[1] + (plBelow?20:-14)).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#f5f7ff">지구</text>
      <g transform="translate(${pt(g,ang+g.dir*0.45)[0].toFixed(1)},${pt(g,ang+g.dir*0.45)[1].toFixed(1)}) rotate(${deg.toFixed(1)})">
        <polygon points="-5,-4.5 5,0 -5,4.5" fill="#f5f7ff"/>
      </g>
    </svg>`;
  }

  /* ---------- 렌더 ---------- */

  function render(){
    const {g, sts, options} = P;
    $('figure').innerHTML = drawFigure(g);
    $('given').innerHTML = `
      <li>${g.near}는 근일점, ${g.far}는 원일점이다.</li>
      <li>${g.mid}는 타원 궤도상의 점이다.</li>
      <li>O는 타원의 중심이고, 화살표는 지구의 운동 방향이다.</li>`;
    $('students').innerHTML = sts.map((s,i)=>
      `<div class="student"><div class="tag"><img src="${AVATARS[i]}" alt="${NAMES[i]}"></div><div class="bubble"><span class="who">${NAMES[i]}</span>${s.text}</div></div>`).join('');
    $('choices').innerHTML = options.map((s,i)=>
      `<button type="button" data-k="${key(s)}" aria-pressed="false">${NUMS[i]} ${subLabel(s)}</button>`).join('');
    $('result').classList.remove('show');
    $('check').disabled = false;
    picked = null; answered = false;
  }

  $('choices').addEventListener('click', e=>{
    const b = e.target.closest('button');
    if(!b || answered) return;
    [...$('choices').children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
    picked = b.dataset.k;
  });

  $('check').addEventListener('click', ()=>{
    if(answered) return;
    if(!picked){ $('verdict').className='verdict no'; $('verdict').textContent='선택지를 하나 고른 뒤 확인을 누르세요.'; $('solutions').innerHTML=''; $('result').classList.add('show'); return; }
    answered = true;
    const ans = key(P.truth), good = picked === ans;
    total++; if(good) correct++;
    $('score').textContent = `${correct} / ${total}`;

    [...$('choices').children].forEach(b=>{
      b.disabled = true;
      if(b.dataset.k === ans) b.classList.add('mark-ok');
      else if(b.dataset.k === picked) b.classList.add('mark-no');
    });

    const n = P.options.findIndex(s=>key(s)===ans);
    $('verdict').className = 'verdict ' + (good ? 'ok' : 'no');
    $('verdict').textContent = good ? `정답입니다. 답은 ${NUMS[n]} ${subLabel(P.truth)}.` : `틀렸습니다. 답은 ${NUMS[n]} ${subLabel(P.truth)}.`;
    $('solutions').innerHTML = P.sts.map((s,i)=>
      `<div class="sol"><h3><span class="mk ${s.ok?'y':'n'}">${s.ok?'○':'×'}</span> 학생 ${NAMES[i]}</h3><p>${s.why}</p></div>`).join('');
    $('result').classList.add('show');
    $('result').scrollIntoView({behavior:'smooth', block:'start'});
  });

  $('next').addEventListener('click', ()=>{ P = newProblem(); render(); window.scrollTo({top:0, behavior:'smooth'}); });

  P = newProblem(); render();
})();
</script>
</body>
</html>
