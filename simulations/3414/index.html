<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>죠니의 손톱탄 돌림힘</title>
<style>
:root{--bg:#e9f3fb;--card:#fff;--tx:#1d2a3a;--mu:#5f7186;--pr:#2f7fd1;--ok:#16a34a;--no:#dc2626;--bd:#c6d8ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--card:#182434;--tx:#e6eef8;--mu:#9bb0c8;--pr:#6fb0ff;--bd:#2c405a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
.w{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1 small{font-size:13px;color:var(--mu);font-weight:500;white-space:nowrap}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.q{font-size:16px;margin:0 0 8px}
.fig{display:flex;gap:8px;align-items:center}
.fig img{width:34%;max-width:130px;border-radius:10px;border:1px solid var(--bd);display:block}
.fig svg{flex:1;min-width:0;height:auto}
.o{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.o button{padding:14px 8px;font-size:16px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px}
.o button.s{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,transparent)}
.o button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.o button.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
.b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.b button{padding:14px;font-size:16px;font-weight:600;border-radius:10px;border:0}
#chk{background:var(--pr);color:#fff}#nw{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}
#chk:disabled{opacity:.4}
#res{display:none}
#res .h{font-weight:700;font-size:17px;margin-bottom:6px}
#res p{margin:4px 0;font-size:15px}
.f{background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:15px}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
.sp2{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
</style></head><body><div class="w">

<div class="c"><div class="o" id="op"></div></div>
<div class="b"><button id="nw">새 문제</button><button id="chk" disabled>확인</button></div>

<script>
const $=id=>document.getElementById(id);
const S={0:[0,'0'],30:[.5,'1/2'],60:[Math.sqrt(3)/2,'√3/2'],90:[1,'1']};
const rad=a=>a*Math.PI/180,rnd=a=>a[Math.floor(Math.random()*a.length)],r2=x=>String(Math.round(x*100)/100);
let P,sel=null,done=false,ok=0,tot=0;
function lbl(k,a){
  if(a==60){const c=r2(k/2);return (c=='1'?'':c)+'√3 N·m';}
  return r2(k*S[a][0])+' N·m';
}
function newQ(){
  const a=rnd([0,30,60,90]),L=rnd([5,6,7,8,9]),F=rnd([5,10,15,20,25,30]);
  P={a,L,F,k:F*L/100};P.ans=P.k*S[a][0];
  const cand=[[P.ans,lbl(P.k,a)]];
  const add=v=>{v=Math.round(v*1000)/1000;if(v>0&&!cand.some(c=>Math.abs(c[0]-v)<.005))cand.push([v,r2(v)+' N·m'])};
  [P.k,P.k*Math.cos(rad(a)),P.F*P.L*S[a][0],P.F*P.L,P.k*2,P.k/2,P.k*1.5,P.k*3].sort(()=>Math.random()-.5).forEach(add);
  P.opts=cand.slice(0,5).sort(()=>Math.random()-.5);sel=null;done=false;
  $('q').innerHTML=`<b>STAGE ${tot+1}.</b> 죠니 죠스타는 손톱을 회전시켜 강력한 손톱탄을 발사하려고 한다. 스탠드의 힘으로 길이 ${L} cm인 손가락에 그림과 같이 ${F} N의 힘을 작용했을 때, 손톱에 작용하는 돌림힘의 크기는 몇 N·m인가?`;
  draw();
  $('op').innerHTML=P.opts.map((o,i)=>`<button data-i="${i}">${'①②③④⑤'[i]} ${o[1]}</button>`).join('');
  document.querySelectorAll('.o button').forEach(b=>b.onclick=()=>{if(done)return;sel=+b.dataset.i;document.querySelectorAll('.o button').forEach(x=>x.classList.remove('s'));b.classList.add('s');$('chk').disabled=false});
  $('chk').disabled=true;$('res').style.display='none';
}
function draw(){
  const {a,L,F}=P,ox=24,oy=125,px=17,tx=ox+L*px,len=Math.min(60,25+F*1.5);
  const ex=tx+len*Math.cos(rad(a)),ey=oy-len*Math.sin(rad(a)),R=30;
  const ax=tx+R*Math.cos(rad(a)),ay=oy-R*Math.sin(rad(a));
  const nx=tx-9,spd=P.ans>0?Math.max(.5,2.4-P.ans*1.5):0;
  const anim=spd?'':'style="animation:none"';
  const sty=spd?`style="animation-duration:${spd}s"`:'style="animation:none"';
  const arc=(a==0)?'':(a==90?`<path d="M${tx+10} ${oy} v-10 h-10" fill="none" stroke="currentColor"/>`:`<path d="M${tx+R} ${oy} A${R} ${R} 0 0 0 ${ax} ${ay}" fill="none" stroke="currentColor"/>`);
  $('fig').innerHTML=`<defs><marker id="h" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker></defs>
  <rect x="${ox}" y="${oy-12}" width="${tx-ox+4}" height="24" rx="12" fill="#f1c9a5" stroke="#c9976b"/>
  <line x1="${ox+(tx-ox)/3}" y1="${oy-10}" x2="${ox+(tx-ox)/3}" y2="${oy+10}" stroke="#c9976b"/>
  <line x1="${ox+2*(tx-ox)/3}" y1="${oy-10}" x2="${ox+2*(tx-ox)/3}" y2="${oy+10}" stroke="#c9976b"/>
  <circle cx="${ox}" cy="${oy}" r="9" fill="var(--card)" stroke="currentColor"/><circle cx="${ox}" cy="${oy}" r="2" fill="currentColor"/>
  <text x="${ox-6}" y="${oy+28}" font-size="14" fill="currentColor">O</text>
  <ellipse cx="${nx}" cy="${oy}" rx="12" ry="9" fill="#7fd8f5" stroke="#3aa6cf"/>
  <ellipse cx="${nx-3}" cy="${oy-3}" rx="5" ry="2.5" fill="#fff" opacity=".6"/>
  <g class="sp" ${sty}><ellipse cx="${nx}" cy="${oy}" rx="21" ry="17" fill="none" stroke="#3aa6cf" stroke-width="2.5" stroke-dasharray="14 9"/></g>
  <g class="sp sp2" ${sty}><ellipse cx="${nx}" cy="${oy}" rx="28" ry="23" fill="none" stroke="#7fd8f5" stroke-width="2" stroke-dasharray="8 12"/></g>
  <line x1="${tx+4}" y1="${oy}" x2="${tx+R+28}" y2="${oy}" stroke="currentColor" stroke-dasharray="4 3"/>
  <line x1="${tx+4}" y1="${oy}" x2="${ex}" y2="${ey}" stroke="#dc2626" stroke-width="3.5" marker-end="url(#h)"/>
  ${arc}${a>0?`<text x="${tx+R+3}" y="${oy-5}" font-size="12" fill="currentColor">${a}°</text>`:''}
  <text x="${Math.min(ex-10,170)}" y="${Math.min(ey-8,oy-34)}" font-size="14" fill="#dc2626" font-weight="700">F = ${F} N</text>
  <line x1="${ox}" y1="${oy+44}" x2="${tx}" y2="${oy+44}" stroke="currentColor"/>
  <line x1="${ox}" y1="${oy+38}" x2="${ox}" y2="${oy+50}" stroke="currentColor"/><line x1="${tx}" y1="${oy+38}" x2="${tx}" y2="${oy+50}" stroke="currentColor"/>
  <text x="${(ox+tx)/2}" y="${oy+66}" font-size="14" text-anchor="middle" fill="currentColor">${L} cm</text>`;
}
$('chk').onclick=()=>{
  if(done||sel===null)return;done=true;tot++;
  const good=Math.abs(P.opts[sel][0]-P.ans)<.005;if(good)ok++;
  $('sc').textContent=ok+' / '+tot;
  document.querySelectorAll('.o button').forEach((b,i)=>{b.disabled=true;if(Math.abs(P.opts[i][0]-P.ans)<.005)b.classList.add('ok');else if(i===sel)b.classList.add('no')});
  const {a,L,F,k}=P;
  $('res').style.display='block';
  $('res').innerHTML=`<div class="h" style="color:var(--${good?'ok':'no'})">${good?(a==90?'⭕ 정답! 수직으로 쏴서 회전이 최대다!':'⭕ 정답! 손톱이 회전하기 시작했다!'):'❌ 회전이 약했다… 다시 도전!'}</div>
  <p>정답: <b>${lbl(k,a)}</b></p><p><b>풀이</b></p>
  <p>돌림힘 τ = r · F · sinθ (θ는 손가락과 힘 사이의 각)</p>
  <div class="f">① r = ${L} cm = ${r2(L/100)} m<br>② τ = ${r2(L/100)} × ${F} × sin${a}°<br>③ τ = ${r2(k)} × ${S[a][1]}<br>④ τ = <b>${lbl(k,a)}</b></div>
  <p style="color:var(--mu)">${a==0?'🐎 힘이 손가락과 같은 방향(0°)이면 sin0°=0이라 돌림힘이 생기지 않아요.':'🐎 힘 중 손가락에 수직인 성분(F sinθ)만 손톱을 돌려요. 90°에서 최대!'}</p>`;
  $('res').scrollIntoView({behavior:'smooth',block:'nearest'});
};
$('nw').onclick=newQ;newQ();
</script></body></html>
