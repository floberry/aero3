  .sea svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .sea .shade{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(20,14,8,.28), rgba(20,14,8,0) 42%);
  }
  .story{margin:14px 2px 12px;font-size:.98rem}
  .story b{font-weight:700}

  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 2px}
  .caption{margin:8px 4px 0;font-size:.82rem;color:var(--ink-soft)}
  svg{display:block;width:100%;height:auto}

  .prompt{margin:16px 2px 12px;font-size:1.02rem;font-weight:500}
  .prompt b{font-weight:700}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
  .choice{
    appearance:none;-webkit-appearance:none;font:inherit;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:13px 12px;text-align:left;display:flex;align-items:center;gap:9px;
    font-variant-numeric:tabular-nums;cursor:pointer;
    transition:border-color .12s ease,background .12s ease;
  }
  .choice .no{
    width:22px;height:22px;flex:0 0 22px;border:1px solid var(--grid-strong);border-radius:50%;
    display:grid;place-items:center;font-size:.78rem;color:var(--ink-soft);
  }
  .choice[aria-pressed="true"]{border-color:var(--fa);background:color-mix(in srgb,var(--fa) 9%,transparent)}
  .choice[aria-pressed="true"] .no{border-color:var(--fa);color:var(--fa)}
  .choice[data-verdict="right"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
  .choice[data-verdict="wrong"]{border-color:var(--no);background:color-mix(in srgb,var(--no) 10%,transparent)}
  .choice:disabled{cursor:default;opacity:1}

  .actions{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
  button.act{appearance:none;font:inherit;font-weight:600;border-radius:11px;padding:14px 12px;cursor:pointer;border:1px solid transparent}
  .primary{background:var(--ink);color:var(--paper)}
  .primary:disabled{opacity:.38;cursor:default}
  .ghost{background:transparent;color:var(--ink);border-color:var(--grid-strong)}
  :where(button,.choice):focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .verdict{margin:16px 0 0;font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px}
  .verdict[data-r="right"]{color:var(--ok)}
  .verdict[data-r="wrong"]{color:var(--no)}

  .solution{margin-top:12px;border-top:1px solid var(--line);padding-top:14px}
  .solution h2{font-size:.95rem;font-weight:700;margin:0 0 10px}
  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:7px 0;font-size:.95rem}
  .steps li i{font-style:normal;font-size:.8rem;color:var(--ink-soft);padding-top:.22em;font-variant-numeric:tabular-nums}
  .eq{display:block;margin-top:4px;font-variant-numeric:tabular-nums;font-weight:600}
  .trap{
    margin-top:10px;padding:11px 12px;border-left:3px solid var(--fb);
    background:color-mix(in srgb,var(--fb) 7%,transparent);border-radius:0 9px 9px 0;
    font-size:.9rem;
  }
  .hidden{display:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>난쟁이 7명과 배</h1>
    <p class="tally" id="tally">0 / 0</p>
  </header>

  <div class="sea">
    <div class="shade"></div>
    <svg id="scene" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sceneDesc">
      <desc id="sceneDesc">노을 지는 바다 위에 배 한 척이 떠 있고, 난쟁이 7명이 두 무리로 나뉘어 밧줄로 배를 당기고 있다.</desc>
      <defs>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity=".28"/>
        </filter>
      </defs>
      <g id="ropes"></g>
      <g id="boat"></g>
      <g id="crew"></g>
      <g id="labels"></g>
    </svg>
  </div>
  <p class="caption">노을 지는 바다를 옆에서 바라본 모습입니다. 화면 위쪽일수록 먼 바다, 아래쪽일수록 가까운 쪽입니다. 난쟁이 한 명이 당기는 힘의 크기는 모두 같습니다.</p>

  <p class="story" id="story"></p>

  <div class="stage">
    <svg id="diagram" viewBox="0 0 300 232" role="img" aria-labelledby="digDesc">
      <desc id="digDesc">두 무리가 당기는 힘을 화살표로 나타낸 힘 도식</desc>
      <defs>
        <marker id="hA" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="var(--fa)"/></marker>
        <marker id="hB" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="var(--fb)"/></marker>
        <marker id="hS" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="var(--sum)"/></marker>
        <marker id="hX" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="var(--grid-strong)"/></marker>
      </defs>
      <g id="gGrid"></g><g id="gAxes"></g><g id="gSum"></g><g id="gVec"></g>
    </svg>
    <p class="caption">힘 도식 — 배를 원점으로 두고 두 무리의 힘을 그린 것입니다. (동서 = 좌우, 남북 = 가까운 쪽/먼 쪽)</p>
  </div>

  <p class="prompt">배에 작용하는 <b>두 힘의 합력</b>의 크기는?</p>

  <div class="choices" id="choices"></div>

  <div class="actions">
    <button class="act primary" id="check" disabled>확인</button>
    <button class="act ghost" id="next">새 문제</button>
  </div>

  <p class="verdict hidden" id="verdict"></p>

  <section class="solution hidden" id="solution" aria-live="polite">
    <h2>풀이</h2>
    <ol class="steps" id="steps"></ol>
    <p class="trap" id="trap"></p>
  </section>

</div>

<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  var CIRCLED = ["①","②","③","④","⑤"];
  var O = {x:150, y:132}, CELL = 26, SPAN = 4;

  var E = {};
  ["ropes","boat","crew","labels","gGrid","gAxes","gSum","gVec"].forEach(function(id){ E[id]=document.getElementById(id); });
  var elStory = document.getElementById("story"),
      elChoices = document.getElementById("choices"),
      elCheck = document.getElementById("check"),
      elNext = document.getElementById("next"),
      elVerdict = document.getElementById("verdict"),
      elSolution = document.getElementById("solution"),
      elSteps = document.getElementById("steps"),
      elTrap = document.getElementById("trap"),
      elTally = document.getElementById("tally");

  var Q=null, picked=null, graded=false, score={right:0,total:0};
  try{ var s=JSON.parse(localStorage.getItem("dwarfboat.score")||"null"); if(s&&typeof s.total==="number"){score=s;} }catch(e){}

  function n(name, attrs, text){
    var e=document.createElementNS(NS,name);
    for(var k in attrs){ e.setAttribute(k,attrs[k]); }
    if(text!==undefined){ e.textContent=text; }
    return e;
  }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function dirName(dx,dy){
    if(dx>0) return "오른쪽(동)";
    if(dx<0) return "왼쪽(서)";
    if(dy>0) return "먼 바다 쪽(북)";
    return "가까운 쪽(남)";
  }

  /* ---------- 문제 만들기 ---------- */
  function makeQuestion(){
    var kind = Math.random()<0.55 ? "perp" : "line";
    var f, A, B, answer;

    if(kind === "perp"){
      f = pick([10,20,30,50]);
      var big = Math.random()<0.5;
      var nA = big?4:3, nB = big?3:4;
      var sx = Math.random()<0.5?1:-1, sy = Math.random()<0.5?1:-1;
      var swap = Math.random()<0.5;
      A = {count:nA, f:f, dx:swap?sx:0, dy:swap?0:sy};
      B = {count:nB, f:f, dx:swap?0:sx, dy:swap?sy:0};
      answer = 5*f;
    }else{
      f = pick([10,20,30,40,50]);
      var split = pick([[5,2],[4,3],[6,1],[2,5],[3,4],[1,6]]);
      var sx2 = Math.random()<0.5?1:-1;
      var horiz = Math.random()<0.5;
      A = {count:split[0], f:f, dx:horiz?sx2:0, dy:horiz?0:sx2};
      B = {count:split[1], f:f, dx:horiz?-sx2:0, dy:horiz?0:-sx2};
      answer = Math.abs(split[0]-split[1])*f;
    }
    A.total = A.count*A.f; B.total = B.count*B.f;

    var set = {};
    set[answer]=1; set[7*f]=1; set[Math.max(A.total,B.total)]=1; set[Math.min(A.total,B.total)]=1;
    var extra = [answer+f, Math.abs(A.total-B.total)+2*f, A.total+B.total-f, 6*f, 2*f];
    for(var i=0;i<extra.length && Object.keys(set).length<5;i++){ if(extra[i]>0){ set[extra[i]]=1; } }
    var opts = Object.keys(set).map(Number).sort(function(a,b){return a-b;}).slice(0,5);
    if(opts.indexOf(answer)===-1){ opts[opts.length-1]=answer; opts.sort(function(a,b){return a-b;}); }

    return {kind:kind, f:f, A:A, B:B, answer:answer, options:opts};
  }

  /* ---------- 노을 바다 장면 (옆에서 본 모습) ---------- */
  // 화면 좌표계: x = 좌우(동서), y = 아래(가까움,남) ~ 위(멀리,북)
  var BASE_Y = 300;          // 배가 떠 있는 기준 수평선(가까운 바다)
  var FAR_Y  = 150;          // 먼 바다 쪽 소실점 부근
  var CX = 150;

  function depthOf(dy){
    // dy: -1(남,가까움) 0(동서) +1(북,멀리) → 0(가까움)~1(멀리) 로 변환
    return dy>0 ? 1 : (dy<0 ? 0 : 0.42);
  }
  function layAt(dx, dy, spread){
    var depth = depthOf(dy);
    var y = BASE_Y + (FAR_Y-BASE_Y)*depth;
    var scale = 1 - 0.45*depth;
    var x = CX + dx*Math.max(46, 130*(1-depth*0.5)) + spread*scale;
    return {x:x, y:y, scale:scale};
  }

  function drawBoat(){
    var g = n("g",{transform:"translate("+CX+","+BASE_Y+")",filter:"url(#soft)"});
    g.appendChild(n("ellipse",{cx:0,cy:14,rx:34,ry:6,fill:"#000","fill-opacity":.18}));
    g.appendChild(n("path",{d:"M-30,4 C-20,16 20,16 30,4 L24,-6 L-24,-6 Z",fill:"var(--silhouette)"}));
    g.appendChild(n("path",{d:"M-15,-6 L-15,-30 M15,-6 L15,-30",stroke:"var(--silhouette)","stroke-width":2}));
    g.appendChild(n("path",{d:"M-15,-28 Q0,-34 15,-28",fill:"none",stroke:"var(--silhouette)","stroke-width":2}));
    E.boat.appendChild(g);
  }

  function drawDwarf(x,y,scale,color){
    var g = n("g",{transform:"translate("+x+","+y+") scale("+scale+")"});
    g.appendChild(n("ellipse",{cx:0,cy:20,rx:8,ry:2.4,fill:"#000","fill-opacity":.16}));
    g.appendChild(n("path",{d:"M0,-16 C-5,-16 -6,-10 -4,-6 L-6,4 L-2,4 L0,-2 L2,4 L6,4 L4,-6 C6,-10 5,-16 0,-16 Z",fill:"var(--silhouette)"}));
    g.appendChild(n("path",{d:"M0,-16 C-6,-16 -7,-19 -7,-21 C-7,-25 -3,-27 0,-27 C3,-27 7,-25 7,-21 C7,-19 6,-16 0,-16 Z",fill:"var(--silhouette)"}));
    g.appendChild(n("path",{d:"M-4,-24 Q0,-30 4,-24 Q2,-22 0,-23 Q-2,-22 -4,-24 Z",fill:color}));
    E.crew.appendChild(g);
  }

  function drawScene(q){
    E.ropes.textContent=""; E.boat.textContent=""; E.crew.textContent=""; E.labels.textContent="";
    drawBoat();

    [[q.A,"var(--fa)"],[q.B,"var(--fb)"]].forEach(function(item){
      var grp=item[0], color=item[1];
      for(var i=0;i<grp.count;i++){
        var spread = (i-(grp.count-1)/2)*15;
        var p = layAt(grp.dx, grp.dy, spread);
        E.ropes.appendChild(n("line",{x1:CX,y1:BASE_Y-4,x2:p.x,y2:p.y-4,stroke:"var(--rope)","stroke-width":Math.max(1,1.6*p.scale),"stroke-opacity":.85}));
        drawDwarf(p.x, p.y, p.scale, color);
      }
      var lp = layAt(grp.dx, grp.dy, 0);
      var ly = lp.y - 34*lp.scale - 4;
      E.labels.appendChild(n("text",{x:lp.x,y:ly,fill:color,"font-size":12,"font-weight":700,"text-anchor":"middle","paint-order":"stroke",stroke:"rgba(255,255,255,.75)","stroke-width":3}, grp.count+"명"));
    });
  }

  /* ---------- 힘 도식 ---------- */
  function drawFrame(){
    E.gGrid.textContent=""; E.gAxes.textContent="";
    for(var i=-SPAN;i<=SPAN;i++){
      E.gGrid.appendChild(n("line",{x1:O.x+i*CELL,y1:O.y-SPAN*CELL,x2:O.x+i*CELL,y2:O.y+SPAN*CELL,stroke:"var(--grid)","stroke-width":1}));
      E.gGrid.appendChild(n("line",{x1:O.x-SPAN*CELL,y1:O.y+i*CELL,x2:O.x+SPAN*CELL,y2:O.y+i*CELL,stroke:"var(--grid)","stroke-width":1}));
    }
    E.gAxes.appendChild(n("line",{x1:O.x-SPAN*CELL-6,y1:O.y,x2:O.x+SPAN*CELL+10,y2:O.y,stroke:"var(--grid-strong)","stroke-width":1.4,"marker-end":"url(#hX)"}));
    E.gAxes.appendChild(n("line",{x1:O.x,y1:O.y+SPAN*CELL+6,x2:O.x,y2:O.y-SPAN*CELL-10,stroke:"var(--grid-strong)","stroke-width":1.4,"marker-end":"url(#hX)"}));
    E.gAxes.appendChild(n("text",{x:O.x+SPAN*CELL+14,y:O.y+4,fill:"var(--ink-soft)","font-size":11},"동"));
    E.gAxes.appendChild(n("text",{x:O.x+4,y:O.y-SPAN*CELL-14,fill:"var(--ink-soft)","font-size":11},"북"));
  }

  function scaleOf(q){
    var m = Math.max(q.A.total, q.B.total);
    return (SPAN-0.4)*CELL/m;
  }

  function drawVectors(q){
    E.gVec.textContent=""; E.gSum.textContent="";
    var sc = scaleOf(q);
    [[q.A,"var(--fa)","url(#hA)","F₁"],[q.B,"var(--fb)","url(#hB)","F₂"]].forEach(function(it){
      var v=it[0], L=v.total*sc;
      var ex=O.x+v.dx*L, ey=O.y-v.dy*L;
      E.gVec.appendChild(n("line",{x1:O.x,y1:O.y,x2:ex,y2:ey,stroke:it[1],"stroke-width":3.2,"stroke-linecap":"round","marker-end":it[2]}));
      var mx=O.x+v.dx*L*0.55, my=O.y-v.dy*L*0.55;
      var lx,ly,anc;
      if(v.dx===0){ lx=mx+11; ly=my+4; anc="start"; }
      else { lx=mx; ly=my-10; anc="middle"; }
      E.gVec.appendChild(n("text",{x:lx,y:ly,fill:it[1],"font-size":12.5,"font-weight":700,"text-anchor":anc,"paint-order":"stroke",stroke:"var(--panel)","stroke-width":3}, it[3]+" = "+v.total+" N"));
    });
  }

  function drawSum(q){
    E.gSum.textContent="";
    var sc=scaleOf(q);
    var vx=(q.A.dx*q.A.total+q.B.dx*q.B.total)*sc;
    var vy=(q.A.dy*q.A.total+q.B.dy*q.B.total)*sc;
    if(Math.abs(vx)<0.5 && Math.abs(vy)<0.5){
      E.gSum.appendChild(n("text",{x:O.x+8,y:O.y-8,fill:"var(--sum)","font-size":12,"font-weight":700},"합력 0"));
      return;
    }
    if(q.kind==="perp"){
      var p1x=O.x+q.A.dx*q.A.total*sc, p1y=O.y-q.A.dy*q.A.total*sc;
      var p2x=O.x+q.B.dx*q.B.total*sc, p2y=O.y-q.B.dy*q.B.total*sc;
      E.gSum.appendChild(n("line",{x1:p1x,y1:p1y,x2:O.x+vx,y2:O.y-vy,stroke:"var(--grid-strong)","stroke-width":1.5,"stroke-dasharray":"4 4"}));
      E.gSum.appendChild(n("line",{x1:p2x,y1:p2y,x2:O.x+vx,y2:O.y-vy,stroke:"var(--grid-strong)","stroke-width":1.5,"stroke-dasharray":"4 4"}));
    }
    var off = q.kind==="line" ? 14 : 0;
    E.gSum.appendChild(n("line",{x1:O.x,y1:O.y+off,x2:O.x+vx,y2:O.y-vy+off,stroke:"var(--sum)","stroke-width":3.4,"stroke-linecap":"round","marker-end":"url(#hS)"}));
    E.gSum.appendChild(n("text",{x:O.x+vx*0.5+(vx>=0?10:-10),y:O.y-vy*0.5+off-9,fill:"var(--sum)","font-size":12.5,"font-weight":700,"text-anchor":vx>=0?"start":"end","paint-order":"stroke",stroke:"var(--panel)","stroke-width":3}, "합력 "+q.answer+" N"));
  }

  /* ---------- 글과 선택지 ---------- */
  function renderStory(q){
    var a=q.A, b=q.B;
    elStory.textContent = "";
    var txt = "노을 지는 바다에 배 한 척이 떠 있습니다. 난쟁이 7명이 배에 밧줄을 묶고, "
      + a.count + "명은 " + dirName(a.dx,a.dy) + "으로, "
      + b.count + "명은 " + dirName(b.dx,b.dy) + "으로 당깁니다. 한 명이 당기는 힘은 각각 "
      + q.f + " N 입니다.";
    elStory.appendChild(document.createTextNode(txt));
  }

  function renderChoices(q){
    elChoices.textContent="";
    q.options.forEach(function(v,i){
      var b=document.createElement("button");
      b.className="choice"; b.type="button";
      b.setAttribute("aria-pressed","false"); b.dataset.value=v;
      var c=document.createElement("span"); c.className="no"; c.textContent=CIRCLED[i];
      b.appendChild(c); b.appendChild(document.createTextNode(v+" N"));
      b.addEventListener("click",function(){ choose(v); });
      elChoices.appendChild(b);
    });
  }

  function choose(v){
    if(graded) return;
    picked=v;
    Array.prototype.forEach.call(elChoices.children,function(b){
      b.setAttribute("aria-pressed", Number(b.dataset.value)===v ? "true":"false");
    });
    elCheck.disabled=false;
  }

  function newQuestion(){
    Q=makeQuestion(); picked=null; graded=false;
    drawScene(Q); drawFrame(); drawVectors(Q);
    renderStory(Q); renderChoices(Q);
    elCheck.disabled=true;
    elVerdict.className="verdict hidden";
    elSolution.className="solution hidden";
    tally();
  }

  function tally(){ elTally.textContent = score.right+" / "+score.total; }

  function grade(){
    if(graded||picked===null) return;
    graded=true;
    var right = picked===Q.answer;
    score.total++; if(right){ score.right++; }
    try{ localStorage.setItem("dwarfboat.score", JSON.stringify(score)); }catch(e){}
    tally();
    Array.prototype.forEach.call(elChoices.children,function(b){
      var v=Number(b.dataset.value); b.disabled=true;
      if(v===Q.answer){ b.dataset.verdict="right"; }
      else if(v===picked){ b.dataset.verdict="wrong"; }
    });
    elVerdict.className="verdict";
    elVerdict.dataset.r = right?"right":"wrong";
    elVerdict.textContent = right ? "정답입니다. 합력의 크기는 "+Q.answer+" N." : "오답입니다. 정답은 "+Q.answer+" N.";
    drawSum(Q);
    renderSolution(Q);
    elSolution.className="solution";
    elCheck.disabled=true;
  }

  function renderSolution(q){
    var a=q.A, b=q.B, steps;
    var aName = a.count+"명("+dirName(a.dx,a.dy)+")", bName = b.count+"명("+dirName(b.dx,b.dy)+")";
    var common = {
      t:"먼저 무리별 힘을 구한다. 같은 방향으로 당기는 힘은 크기끼리 더할 수 있다.",
      eq: aName+" : "+a.count+" × "+q.f+" N = "+a.total+" N　／　"+bName+" : "+b.count+" × "+q.f+" N = "+b.total+" N"
    };

    if(q.kind==="perp"){
      steps=[common,
        {t:"두 무리가 당기는 방향은 서로 수직이다. 방향이 다르므로 크기끼리 그냥 더할 수 없고, 각 축의 성분으로 나누어 본다.",eq:null},
        {t:"두 성분이 직각을 이루므로 합력의 크기는 피타고라스 정리로 구한다.",
         eq:"|F₁ + F₂| = √("+a.total+"² + "+b.total+"²) = √"+(a.total*a.total+b.total*b.total)+" = "+q.answer+" N"},
        {t:"힘 도식의 주황색 화살표가 합력이다. 배는 두 힘이 만드는 직사각형의 대각선 방향으로 끌려간다.",eq:null}
      ];
      elTrap.textContent = "자주 하는 실수: 난쟁이가 7명이니 7 × "+q.f+" N = "+(7*q.f)+" N 이라고 답하는 것. 방향이 다른 힘은 단순히 더할 수 없다.";
    }else{
      var big = a.total>=b.total ? a : b, small = a.total>=b.total ? b : a;
      steps=[common,
        {t:"두 무리는 정반대 방향으로 당긴다. 일직선상의 반대 방향이므로 한쪽을 +, 반대쪽을 − 로 두고 더한다.",
         eq:"("+ (big===a?"+":"−") + a.total+" N) + (" + (big===a?"−":"+") + b.total+" N)"},
        {t:"크기가 큰 쪽에서 작은 쪽을 뺀 값이 합력의 크기이고, 방향은 큰 쪽과 같다.",
         eq:"|F₁ + F₂| = "+big.total+" N − "+small.total+" N = "+q.answer+" N ("+dirName(big.dx,big.dy)+")"},
        {t:"결국 남는 힘은 인원 차이만큼이다. "+Math.abs(a.count-b.count)+"명 × "+q.f+" N 으로 계산해도 같은 답이 나온다.",eq:null}
      ];
      elTrap.textContent = "자주 하는 실수: 전체 인원으로 7 × "+q.f+" N = "+(7*q.f)+" N 이라고 답하거나, 많은 쪽 인원만 보고 "+big.total+" N 이라고 답하는 것. 반대 방향으로 당기는 힘은 서로 상쇄된다.";
    }

    elSteps.textContent="";
    steps.forEach(function(s,i){
      var li=document.createElement("li");
      var num=document.createElement("i"); num.textContent=(i+1)+".";
      var body=document.createElement("div");
      body.appendChild(document.createTextNode(s.t));
      if(s.eq){ var e=document.createElement("span"); e.className="eq"; e.textContent=s.eq; body.appendChild(e); }
      li.appendChild(num); li.appendChild(body); elSteps.appendChild(li);
    });
  }

  elCheck.addEventListener("click", grade);
  elNext.addEventListener("click", newQuestion);
  document.addEventListener("keydown",function(e){
    if(e.key==="Enter" && !elCheck.disabled){ grade(); }
    else if(e.key && e.key.toLowerCase()==="n"){ newQuestion(); }
  });

  newQuestion();
})();
</script>
</body>
</html>
