<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>등속 원운동 문제 연습</title>
<style>
  :root{
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #1c2321;
    --ink-soft: #5b6460;
    --line: #dedad0;
    --accent: #2d5c4f;
    --accent-ink: #ffffff;
    --a-color: #b3701f;
    --b-color: #4a4f52;
    --ok: #2d7a46;
    --bad: #b23a2f;
    --chip-bg: #eef0ea;
    --radius-s: 6px;
    --radius-m: 12px;
    --serif: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a; --panel:#1c2224; --ink:#eef0ee; --ink-soft:#a3aca7;
      --line:#31383a; --accent:#5ba98c; --accent-ink:#0d1210;
      --a-color:#d99a4e; --b-color:#9aa0a4; --ok:#4fbf78; --bad:#ff7a68;
      --chip-bg:#232b2c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a; --panel:#1c2224; --ink:#eef0ee; --ink-soft:#a3aca7;
    --line:#31383a; --accent:#5ba98c; --accent-ink:#0d1210;
    --a-color:#d99a4e; --b-color:#9aa0a4; --ok:#4fbf78; --bad:#ff7a68;
    --chip-bg:#232b2c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:18px 16px 48px;
  }
  header{
    text-align:left;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
    margin-bottom:16px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
  }
  header .title{
    font-family:var(--serif);
    font-weight:700;
    font-size:1.35rem;
    letter-spacing:-0.01em;
  }
  header .sub{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .legend{
    display:flex;
    gap:14px;
    justify-content:center;
    margin:2px 0 8px;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .newBtn{
    flex:0 0 auto;
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:999px;
    padding:9px 15px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .newBtn:active{ transform:scale(0.97); }

  section{ margin-bottom:20px; }
  .label-tag{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    color:var(--accent);
    border:1.3px solid var(--accent);
    border-radius:999px;
    padding:2px 9px;
    margin-bottom:8px;
  }

  .problem-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:16px;
    font-size:0.93rem;
  }
  .problem-box b{ color:var(--ink); }

  .figure-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:10px 8px 14px;
  }
  svg{ display:block; width:100%; height:auto; }
  .anim-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    padding:0 4px;
  }
  .ctrl-btn{
    background:var(--chip-bg);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:var(--radius-s);
    padding:8px 12px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
  }
  .ctrl-btn:active{ transform:scale(0.97); }
  .elapsed{
    margin-left:auto;
    font-size:0.78rem;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .bogi-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:4px 16px;
  }
  .bogi-title{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    border-bottom:1px solid var(--line);
    padding:10px 0 8px;
    margin-bottom:4px;
  }
  .bogi-item{
    display:flex;
    gap:8px;
    padding:10px 0;
    font-size:0.93rem;
    border-bottom:1px dashed var(--line);
  }
  .bogi-item:last-child{ border-bottom:none; }
  .bogi-item .mark{ font-weight:700; flex:0 0 auto; }
  .frac{
    display:inline-flex;
    flex-direction:column;
    vertical-align:middle;
    text-align:center;
    font-size:0.88em;
    line-height:1.05;
    margin:0 2px;
    transform:translateY(1px);
  }
  .frac .num{ border-bottom:1.4px solid currentColor; padding:0 3px; }
  .frac .den{ padding:0 3px; }

  .choices{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
  }
  .choice-btn{
    background:var(--panel);
    border:1.4px solid var(--line);
    border-radius:var(--radius-s);
    padding:10px 4px;
    font-size:0.86rem;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
  }
  .choice-btn.selected{
    border-color:var(--accent);
    background:var(--accent);
    color:var(--accent-ink);
  }
  .choice-btn:active{ transform:scale(0.97); }

  .check-btn{
    display:block;
    width:100%;
    margin-top:16px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:var(--radius-s);
    padding:14px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
  }
  .check-btn:active{ transform:scale(0.98); }
  .check-btn:disabled{ opacity:0.5; }

  .hint{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:8px;
    min-height:1.1em;
  }

  .result-panel{
    margin-top:18px;
    border-radius:var(--radius-m);
    overflow:hidden;
    border:1px solid var(--line);
    display:none;
  }
  .result-banner{
    padding:14px 16px;
    font-weight:700;
    font-size:1rem;
  }
  .result-banner.ok{ background:var(--ok); color:#fff; }
  .result-banner.bad{ background:var(--bad); color:#fff; }
  .explain{
    background:var(--panel);
    padding:14px 16px 18px;
    font-size:0.9rem;
  }
  .explain h4{
    margin:14px 0 6px;
    font-size:0.85rem;
    color:var(--accent);
  }
  .explain h4:first-child{ margin-top:0; }
  .explain p{ margin:4px 0; }
  .verdict-row{
    display:flex;
    gap:8px;
    align-items:flex-start;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    font-size:0.87rem;
  }
  .verdict-row:last-child{ border-bottom:none; }
  .verdict-tag{
    flex:0 0 auto;
    font-size:0.72rem;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    color:#fff;
    margin-top:1px;
  }
  .verdict-tag.true{ background:var(--ok); }
  .verdict-tag.false{ background:var(--bad); }

  footer{
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:26px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title">등속 원운동 연습</div>
      <div class="sub">y축 출발 · x축 도달 유형</div>
    </div>
    <button class="newBtn" id="newProblemBtn">새 문제</button>
  </header>

  <section>
    <div class="label-tag">문제</div>
    <div class="problem-box" id="problemText"></div>
  </section>

  <section>
    <div class="label-tag">그림 · 시뮬레이션</div>
    <div class="figure-wrap">
      <div class="legend">
        <span><i style="background:var(--b-color)"></i>B = 톰 (큰 원)</span>
        <span><i style="background:var(--a-color)"></i>A = 제리 (작은 원)</span>
      </div>
      <svg id="scene" viewBox="0 0 400 260"></svg>
      <div class="anim-controls">
        <button class="ctrl-btn" id="playBtn">▶ 재생</button>
        <button class="ctrl-btn" id="resetBtn">처음으로</button>
        <span class="elapsed" id="elapsedText">0.00초</span>
      </div>
    </div>
  </section>

  <section>
    <div class="bogi-box">
      <div class="bogi-title">&lt; 보　기 &gt;</div>
      <div class="bogi-item"><span class="mark">ㄱ.</span><span id="statGi"></span></div>
      <div class="bogi-item"><span class="mark">ㄴ.</span><span id="statNa"></span></div>
      <div class="bogi-item"><span class="mark">ㄷ.</span><span id="statDa"></span></div>
    </div>

    <div class="choices" id="choiceGrid"></div>
    <button class="check-btn" id="checkBtn">확인</button>
    <div class="hint" id="hintText"></div>
  </section>

  <div class="result-panel" id="resultPanel">
    <div class="result-banner" id="resultBanner"></div>
    <div class="explain" id="explainBody"></div>
  </div>

  <footer>반지름 · 시간 값이 매번 무작위로 바뀝니다. 새 문제 버튼으로 계속 연습하세요.</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- helpers ----------
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b, a%b]; } return a||1; }
  function reduceFrac(n,d){ const g = gcd(n,d); return [n/g, d/g]; }
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function choice(arr){ return arr[randInt(0, arr.length-1)]; }
  function fracHTML(n,d){
    if(d===1) return n+"π";
    return '<span class="frac"><span class="num">'+n+'π</span><span class="den">'+d+'</span></span>';
  }

  const CHOICE_PATTERNS = [
    {opt:1, set:["ㄱ"]},
    {opt:2, set:["ㄷ"]},
    {opt:3, set:["ㄱ","ㄴ"]},
    {opt:4, set:["ㄴ","ㄷ"]},
    {opt:5, set:["ㄱ","ㄴ","ㄷ"]}
  ];
  const CHOICE_LABELS = {1:"① ㄱ", 2:"② ㄷ", 3:"③ ㄱ, ㄴ", 4:"④ ㄴ, ㄷ", 5:"⑤ ㄱ, ㄴ, ㄷ"};

  let state = {};
  let anim = { playing:false, elapsed:0, rafId:null, lastTs:null, flipA:{dir:1}, flipB:{dir:1} };

  // ---------- problem generation ----------
  function generateProblem(){
    const t = choice([4,6,8,10,12]);
    const rA = randInt(1,3);
    const rB = rA + randInt(2,6);

    const TA = 4*t;
    const TB = t;

    const [vAn, vAd] = reduceFrac(rA, 2*t);      // v_A = (rA / 2t) * pi
    const [vBn, vBd] = reduceFrac(2*rB, t);      // v_B = (2rB / t) * pi

    const pattern = choice(CHOICE_PATTERNS);
    const trueSet = pattern.set;
    const correctOption = pattern.opt;

    // ㄱ
    const giTrue = trueSet.includes("ㄱ");
    let giValue;
    if(giTrue){ giValue = TA; }
    else{
      const opts = [t, 2*t, 3*t, 6*t, 8*t].filter(v=>v!==TA);
      giValue = choice(opts);
    }

    // ㄴ
    const naTrue = trueSet.includes("ㄴ");
    let naNum, naDen;
    if(naTrue){ naNum = vBn; naDen = vBd; }
    else{
      naNum = vAn; naDen = vAd;
      if(naNum/naDen === vBn/vBd){ naNum = vBn*2; naDen = vBd; }
    }

    // ㄷ (physically centripetal accel of A is ALWAYS smaller than B, given TA = 4*TB)
    const daTrue = trueSet.includes("ㄷ");
    const daWord = daTrue ? "작다" : "크다";

    state = {
      rA, rB, t, TA, TB,
      vAn, vAd, vBn, vBd,
      giTrue, giValue,
      naTrue, naNum, naDen,
      daTrue, daWord,
      correctOption,
      selected: null,
      answered: false
    };

    anim.elapsed = 0;
    anim.playing = false;
    if(anim.rafId){ cancelAnimationFrame(anim.rafId); anim.rafId = null; }

    render();
  }

  // ---------- rendering: text & choices ----------
  function render(){
    document.getElementById("problemText").innerHTML =
      "물체 A, B가 <i>xy</i>평면상의 원점을 중심으로 반지름이 각각 <b>"+state.rA+"m, "+state.rB+"m</b>인 궤도를 따라 " +
      "등속 원운동을 하는 모습이다. A, B가 <i>y</i>축상의 점 a, b에서 동시에 출발하여, <b>"+state.t+"초</b> 후에 " +
      "A는 <i>x</i>축상의 점 c에 처음으로 도달하고, B는 한 바퀴를 돌아 b에 도달한다.";

    document.getElementById("statGi").textContent = "A의 주기는 " + state.giValue + "초이다.";
    document.getElementById("statNa").innerHTML = "B의 속력은 " + fracHTML(state.naNum, state.naDen) + " m/s이다.";
    document.getElementById("statDa").textContent = "구심 가속도의 크기는 A가 B보다 " + state.daWord + ".";

    const grid = document.getElementById("choiceGrid");
    grid.innerHTML = "";
    [1,2,3,4,5].forEach(function(opt){
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = CHOICE_LABELS[opt];
      btn.dataset.opt = opt;
      btn.addEventListener("click", function(){ selectChoice(opt); });
      grid.appendChild(btn);
    });

    document.getElementById("hintText").textContent = "";
    document.getElementById("resultPanel").style.display = "none";
    document.getElementById("checkBtn").disabled = false;

    drawScene();
  }

  function selectChoice(opt){
    if(state.answered) return;
    state.selected = opt;
    document.querySelectorAll(".choice-btn").forEach(function(b){
      b.classList.toggle("selected", Number(b.dataset.opt) === opt);
    });
    document.getElementById("hintText").textContent = "";
  }

  // ---------- check answer ----------
  function checkAnswer(){
    if(state.selected == null){
      document.getElementById("hintText").textContent = "먼저 답을 골라 주세요.";
      return;
    }
    state.answered = true;
    const isCorrect = state.selected === state.correctOption;

    const panel = document.getElementById("resultPanel");
    const banner = document.getElementById("resultBanner");
    panel.style.display = "block";
    banner.className = "result-banner " + (isCorrect ? "ok" : "bad");
    banner.textContent = isCorrect
      ? "정답입니다! (정답: " + CHOICE_LABELS[state.correctOption].slice(2) + ")"
      : "오답입니다. 정답은 " + CHOICE_LABELS[state.correctOption] + " 입니다.";

    document.getElementById("explainBody").innerHTML = buildExplanation();
    panel.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  function buildExplanation(){
    const s = state;
    let html = "";
    html += "<h4>1. B의 주기</h4>";
    html += "<p>B는 "+s.t+"초 만에 한 바퀴를 돌아 원래 위치 b로 돌아왔으므로, B의 주기는 T<sub>B</sub> = "+s.t+"초 이다.</p>";

    html += "<h4>2. A의 주기</h4>";
    html += "<p>A는 <i>y</i>축의 점 a에서 출발해 <i>x</i>축의 점 c에 처음 도달했다. y축과 x축은 90˚를 이루므로 이는 원의 "+
            "1/4 바퀴에 해당한다. 즉 (1/4)T<sub>A</sub> = "+s.t+"초 이므로, T<sub>A</sub> = 4 × "+s.t+" = <b>"+s.TA+"초</b> 이다.</p>";

    html += "<h4>3. 속력</h4>";
    html += "<p>v<sub>A</sub> = 2πr<sub>A</sub> / T<sub>A</sub> = 2π×"+s.rA+" / "+s.TA+" = "+fracHTML(s.vAn,s.vAd)+" m/s</p>";
    html += "<p>v<sub>B</sub> = 2πr<sub>B</sub> / T<sub>B</sub> = 2π×"+s.rB+" / "+s.TB+" = "+fracHTML(s.vBn,s.vBd)+" m/s</p>";

    html += "<h4>4. 구심 가속도 비교</h4>";
    html += "<p>구심가속도는 a = 4π²r / T² 이다. B의 주기가 A의 주기의 1/4 배로 훨씬 짧아 T² 항의 영향이 커지므로, " +
            "반지름 차이를 감안하더라도 <b>A의 구심가속도가 B보다 항상 작다.</b></p>";

    html += "<h4>보기 판정</h4>";
    html += verdictRow("ㄱ", s.giTrue, "실제 A의 주기는 "+s.TA+"초이므로, 제시된 값("+s.giValue+"초)은 " + (s.giTrue?"옳다.":"틀리다."));
    html += verdictRow("ㄴ", s.naTrue, "실제 B의 속력은 "+numToText(s.vBn,s.vBd)+" m/s이므로, 제시된 값은 " + (s.naTrue?"옳다.":"틀리다."));
    html += verdictRow("ㄷ", s.daTrue, "실제로 A의 구심가속도는 B보다 항상 작으므로, 제시된 문장은 " + (s.daTrue?"옳다.":"틀리다."));

    return html;
  }
  function numToText(n,d){ return d===1 ? (n+"π") : (n+"π/"+d); }
  function verdictRow(mark, isTrue, text){
    return '<div class="verdict-row"><span class="verdict-tag '+(isTrue?"true":"false")+'">'+(isTrue?"참":"거짓")+'</span>' +
           '<span><b>'+mark+'.</b> '+text+'</span></div>';

AbZ+ddCEkD3RvQoU3pAOrSEqGwOe9GQAANhyoUKIWLhACQaPwJ2GOZoUKYCC8CU5AG1H4RgnFChRIwc9sUZIBI2oUKYdIZ3HT9qvuWrjAYkdlqThaccsKG4rN71fbnoa/t262zn3oa1Y8mYrzgkdgTuPxoUK10tuO5DUIrnnwGpJSlK1gEhPKjke9n6UKFZpcgfJCW69yJl3mQnG2Q2y8UJKQQrH40rqGwwL/AAnmpzIUtpHG28nZxs+hoUKtxiaGkkYglluclTchCXAHVIyRvgHn86caf4jcLeC4sqanNBK877OJH6UKFXQe/wC5hi3lfqf/2Q==";
  const TOM_ASPECT = 305/220;   // width/height of tom_cut.png
  const JERRY_ASPECT = 202/220; // width/height of jerry_cut.png

  // ---------- scene drawing ----------
  const VBW = 400, VBH = 260, CX = 200, CY = 148, MAXPX = 96;

  function trailArc(cx, cy, r, angleDeg, color){
    const segs = 9;
    let s = "";
    for(let i=1;i<=segs;i++){
      const a0 = (angleDeg + (i-1)*2.6) * Math.PI/180;
      const a1 = (angleDeg + i*2.6) * Math.PI/180;
      const x0 = cx + r*Math.cos(a0), y0 = cy - r*Math.sin(a0);
      const x1 = cx + r*Math.cos(a1), y1 = cy - r*Math.sin(a1);
      const op = (1 - i/segs) * 0.55;
      const w = Math.max(1, 6 - i*0.5);
      s += '<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y1+'" stroke="'+color+'" stroke-width="'+w.toFixed(2)+'" stroke-linecap="round" opacity="'+op.toFixed(2)+'"/>';
    }
    return s;
  }

  // draws the raw cutout photo (no frame/circle), facing travel direction, with a running bob
  function drawCharacter(x, y, angleDeg, href, aspect, h, bobPhase, flipState){
    const amp = h * 0.10;
    const bob = amp * Math.abs(Math.sin(bobPhase));
    const sinA = Math.sin(angleDeg * Math.PI/180);
    if(Math.abs(sinA) > 0.06){ flipState.dir = sinA >= 0 ? 1 : -1; }
    const flip = flipState.dir;

    const w = h * aspect;
    const cx = x, cy = y - bob;
    const groundY = y + h*0.32;

    let s = "";
    s += '<ellipse cx="'+cx+'" cy="'+groundY+'" rx="'+(w*0.36)+'" ry="'+(h*0.10)+'" fill="rgba(0,0,0,0.28)" />';
    s += '<g transform="translate('+cx+','+cy+') scale('+flip+',1) translate('+(-cx)+','+(-cy)+')">';
    s += '<image href="'+href+'" x="'+(cx-w/2)+'" y="'+(cy-h/2)+'" width="'+w+'" height="'+h+'" preserveAspectRatio="xMidYMid meet"/>';
    s += '</g>';
    return s;
  }

  function drawScene(){
    const svg = document.getElementById("scene");
    const scale = MAXPX / state.rB;
    const rApx = scale * state.rA;
    const rBpx = scale * state.rB;

    const inkColor = "#2b2b2b";
    const softColor = "#4a4a4a";
    const lineColor = "rgba(255,255,255,0.75)";

    let s = "";
    // background chase-scene photo, covering the whole viewBox
    s += '<image href="'+BG_IMG+'" x="0" y="0" width="'+VBW+'" height="'+VBH+'" preserveAspectRatio="xMidYMid slice"/>';
    // translucent panel so the track/axes stay legible over the busy artwork
    s += '<rect x="14" y="6" width="'+(VBW-28)+'" height="'+(VBH-12)+'" rx="16" fill="rgba(255,255,255,0.5)"/>';

    // axes
    s += arrow(30, CY, VBW-20, CY, inkColor);
    s += arrow(CX, VBH-15, CX, 18, inkColor);
    s += text(VBW-24, CY-8, "x(m)", softColor, "end", 11);
    s += text(CX+10, 26, "y(m)", softColor, "start", 11);
    s += text(CX+6, CY+16, "O", softColor, "start", 11);

    // orbit circles
    s += '<circle cx="'+CX+'" cy="'+CY+'" r="'+rApx+'" fill="none" stroke="'+lineColor+'" stroke-width="1.6" stroke-dasharray="4 3"/>';
    s += '<circle cx="'+CX+'" cy="'+CY+'" r="'+rBpx+'" fill="none" stroke="'+lineColor+'" stroke-width="1.6" stroke-dasharray="4 3"/>';

    // tick labels on x-axis
    s += tick(CX+rApx, CY, String(state.rA), softColor);
    s += tick(CX+rBpx, CY, String(state.rB), softColor);

    // start points a, b and target c
    s += dot(CX, CY-rApx, "var(--a-color)", 3);
    s += text(CX-14, CY-rApx-6, "a", inkColor, "middle", 12);
    s += dot(CX, CY-rBpx, "var(--b-color)", 3);
    s += text(CX-14, CY-rBpx-6, "b", inkColor, "middle", 12);
    s += dot(CX+rApx, CY, softColor, 3);
    s += text(CX+rApx+6, CY+16, "c", inkColor, "middle", 12);

    // moving points: A = Jerry (small circle), B = Tom (big circle)
    const angA = 90 - (360/state.TA) * anim.elapsed;
    const angB = 90 - (360/state.TB) * anim.elapsed;
    const radA = angA * Math.PI/180, radB = angB * Math.PI/180;
    const ax = CX + rApx*Math.cos(radA), ay = CY - rApx*Math.sin(radA);
    const bx = CX + rBpx*Math.cos(radB), by = CY - rBpx*Math.sin(radB);

    const stepFreqA = (2*Math.PI/state.TA) * 30;
    const stepFreqB = (2*Math.PI/state.TB) * 30;

    s += trailArc(CX, CY, rApx, angA, "var(--a-color)");
    s += trailArc(CX, CY, rBpx, angB, "var(--b-color)");

    s += drawCharacter(ax, ay, angA, JERRY_IMG, JERRY_ASPECT, 42, anim.elapsed*stepFreqA, anim.flipA);
    s += drawCharacter(bx, by, angB, TOM_IMG, TOM_ASPECT, 50, anim.elapsed*stepFreqB, anim.flipB);
    s += text(ax, ay-34, "A(제리)", "#7a4a12", "middle", 10, true);
    s += text(bx, by-38, "B(톰)", "#33383b", "middle", 10, true);

    svg.innerHTML = s;

    document.getElementById("elapsedText").textContent =
      anim.elapsed.toFixed(2) + "초 / " + state.t + "초 (A 1바퀴 = " + state.TA + "초)";
  }

  function arrow(x1,y1,x2,y2,color){
    const ang = Math.atan2(y2-y1, x2-x1);
    const len = 7;
    const a1x = x2 - len*Math.cos(ang-0.4), a1y = y2 - len*Math.sin(ang-0.4);
    const a2x = x2 - len*Math.cos(ang+0.4), a2y = y2 - len*Math.sin(ang+0.4);
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="1.6"/>' +
           '<polyline points="'+a1x+','+a1y+' '+x2+','+y2+' '+a2x+','+a2y+'" fill="none" stroke="'+color+'" stroke-width="1.6"/>';
  }
  function dot(x,y,color,r){
    return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+color+'"/>';
  }
  function text(x,y,str,color,anchor,size,bold){
    return '<text x="'+x+'" y="'+y+'" fill="'+color+'" text-anchor="'+(anchor||"start")+'" font-size="'+(size||11)+'" ' +
           'font-family="sans-serif" font-weight="'+(bold?"700":"500")+'">'+str+'</text>';
  }
  function tick(x,y,label,color){
    return '<line x1="'+x+'" y1="'+(y-3)+'" x2="'+x+'" y2="'+(y+3)+'" stroke="'+color+'" stroke-width="1.4"/>' +
           text(x, y+16, label, color, "middle", 10);
  }

  // ---------- animation loop ----------
  function tickFrame(ts){
    if(anim.lastTs == null) anim.lastTs = ts;
    const dtReal = (ts - anim.lastTs)/1000;
    anim.lastTs = ts;

    const realDurationForFullA = 6; // seconds of real time per full A revolution
    const simSpeed = state.TA / realDurationForFullA;
    anim.elapsed += dtReal * simSpeed;
    if(anim.elapsed > state.TA) anim.elapsed -= state.TA;

    drawScene();
    if(anim.playing){ anim.rafId = requestAnimationFrame(tickFrame); }
  }

  function togglePlay(){
    anim.playing = !anim.playing;
    document.getElementById("playBtn").textContent = anim.playing ? "❚❚ 일시정지" : "▶ 재생";
    if(anim.playing){
      anim.lastTs = null;
      anim.rafId = requestAnimationFrame(tickFrame);
    } else if(anim.rafId){
      cancelAnimationFrame(anim.rafId);
      anim.rafId = null;
    }
  }

  function resetAnim(){
    anim.elapsed = 0;
    anim.playing = false;
    anim.lastTs = null;
    if(anim.rafId){ cancelAnimationFrame(anim.rafId); anim.rafId = null; }
    document.getElementById("playBtn").textContent = "▶ 재생";
    drawScene();
  }

  // ---------- wire up ----------
  document.getElementById("newProblemBtn").addEventListener("click", generateProblem);
  document.getElementById("checkBtn").addEventListener("click", checkAnswer);
  document.getElementById("playBtn").addEventListener("click", togglePlay);
  document.getElementById("resetBtn").addEventListener("click", resetAnim);

  generateProblem();
})();
