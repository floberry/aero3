<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>돌림힘 연습 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF6DC;
    --bg-panel: #FFFDF6;
    --ink: #2B2100;
    --ink-soft: #8A7B45;
    --line: #F0DFA0;
    --steel: #2E6DA4;
    --steel-deep: #1E4E7A;
    --amber: #FFB100;
    --amber-deep: #CC8B00;
    --good: #2E9B4F;
    --bad: #C23B32;
    --meter-bg: #142A4D;
    --meter-text: #FFE7A0;
    --meter-dim: #7C8CB0;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #1B1706;
      --bg-panel: #241E0C;
      --ink: #FBF0D0;
      --ink-soft: #C2AE72;
      --line: #453A16;
      --steel: #6FA8CC;
      --steel-deep: #8FC0E0;
      --amber: #FFC53D;
      --amber-deep: #FFD873;
      --good: #5CBE84;
      --bad: #E0685F;
      --meter-bg: #0B1830;
      --meter-text: #FFE7A0;
      --meter-dim: #5C6C90;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1706;
    --bg-panel: #241E0C;
    --ink: #FBF0D0;
    --ink-soft: #C2AE72;
    --line: #453A16;
    --steel: #6FA8CC;
    --steel-deep: #8FC0E0;
    --amber: #FFC53D;
    --amber-deep: #FFD873;
    --good: #5CBE84;
    --bad: #E0685F;
    --meter-bg: #0B1830;
    --meter-text: #FFE7A0;
    --meter-dim: #5C6C90;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-text-size-adjust: 100%;
  }
  body{
    display:flex;
    justify-content:center;
    padding: 20px 14px 48px;
  }
  .app{
    width:100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  header{ padding: 4px 4px 2px; }
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--amber-deep);
  }
  h1{
    margin: 4px 0 2px;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .sub{
    margin:0;
    font-size: 14px;
    color: var(--ink-soft);
    line-height:1.5;
  }

  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
  }

  /* --- Wrench diagram --- */
  .diagram-panel{
    padding: 10px 8px 14px;
    position: relative;
    overflow: hidden;
  }
  .diagram-panel::before{
    content:"O₁ — 볼트 회전축을 기준으로 돌림힘을 구하라";
    display:block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--meter-dim);
    padding: 0 4px 8px;
  }
  svg#wrenchSvg{ width:100%; height:auto; display:block; }
  #wrenchPhoto{ filter: sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.08) contrast(0.95); }

  /* --- Mascot + banana streak --- */
  .buddy-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 2px 4px;
  }
  .mascot{ width:56px; height:70px; flex-shrink:0; }
  .mascot .mood{ display:none; }
  .mascot[data-mood="neutral"] .mood-neutral,
  .mascot[data-mood="happy"] .mood-happy,
  .mascot[data-mood="sad"] .mood-sad{ display:block; }
  .banana-tray{
    flex:1;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:2px;
    min-height:28px;
  }
  .banana-tray .empty-hint{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
  }
  .banana{ width:26px; height:26px; animation: bananaPop 0.35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bananaPop{
    from{ transform: scale(0) rotate(-25deg); opacity:0; }
    to{ transform: scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes bananaOut{
    to{ transform: scale(0) rotate(25deg); opacity:0; }
  }

  /* --- Meter readout --- */
  .meter{
    background: var(--meter-bg);
    border-radius: 4px;
    padding: 14px 16px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .meter .cell{
    display:flex;
    flex-direction:column;
    gap: 3px;
  }
  .meter .label{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--meter-dim);
  }
  .meter .value{
    font-family: var(--font-mono);
    font-size: 21px;
    font-weight: 700;
    color: var(--meter-text);
  }
  .meter .value .unit{
    font-size: 12px;
    font-weight: 400;
    color: var(--meter-dim);
    margin-left: 2px;
  }

  .input-hint{
    margin: 0 0 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .input-hint b{
    font-family: var(--font-mono);
    color: var(--ink);
  }

  /* --- Answer row --- */
  .answer-row{
    display:flex;
    gap:8px;
    align-items:stretch;
  }
  .answer-field{
    flex:1;
    display:flex;
    align-items:center;
    background: var(--bg-panel);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    padding: 0 12px;
    transition: border-color 0.15s ease;
  }
  .answer-field:focus-within{
    border-color: var(--steel);
  }
  .answer-field input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 18px;
    padding: 13px 0;
  }
  .answer-field .suffix{
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-soft);
    white-space:nowrap;
  }

  button{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    border-radius: 4px;
    border: 1.5px solid transparent;
    padding: 13px 18px;
    cursor:pointer;
    transition: transform 0.08s ease, filter 0.12s ease;
  }
  button:active{ transform: scale(0.97); }
  button:focus-visible{ outline: 2px solid var(--steel); outline-offset: 2px; }

  .btn-check{
    background: var(--amber);
    color: #FFF7ED;
    white-space:nowrap;
  }
  .btn-check:hover{ filter: brightness(1.06); }

  .btn-new{
    width:100%;
    background: transparent;
    color: var(--steel-deep);
    border-color: var(--steel);
  }
  .btn-new:hover{ background: color-mix(in srgb, var(--steel) 10%, transparent); }

  /* --- Result --- */
  .result{
    display:none;
  }
  .result.show{ display:block; }
  .result-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 10px;
  }
  .badge{
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 3px;
  }
  .badge.correct{ background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .badge.wrong{ background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .result-head .answer-echo{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .steps{
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 2;
    color: var(--ink);
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }
  .steps .line{ display:block; }
  .steps .final{
    color: var(--amber-deep);
    font-weight: 700;
  }

  footer{
    text-align:center;
    font-size: 11px;
    color: var(--ink-soft);
    padding-top: 4px;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">MECHANICS · 돌림힘(torque)</div>
    <h1>렌치 돌림힘 연습</h1>
    <p class="sub">렌치에 비스듬히 힘을 줄 때 너트에 작용하는 돌림힘의 크기를 구해보세요.</p>
  </header>

  <div class="panel buddy-row">
    <svg class="mascot" id="buddyFace" data-mood="neutral" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="140" rx="28" ry="6" fill="#000" opacity="0.08"/>
      <!-- capsule body -->
      <rect x="24" y="12" width="72" height="118" rx="36" fill="var(--amber)" stroke="var(--amber-deep)" stroke-width="3"/>
      <!-- hair tufts -->
      <path d="M50 14 Q46 2 42 12" stroke="#2B2100" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M60 12 Q58 -2 56 10" stroke="#2B2100" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M70 14 Q74 2 78 12" stroke="#2B2100" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- arms: down (neutral/sad) -->
      <g class="mood mood-neutral mood-sad">
        <rect x="10" y="72" width="32" height="12" rx="6" fill="var(--amber)" stroke="var(--amber-deep)" stroke-width="2" transform="rotate(18 26 78)"/>
        <rect x="78" y="72" width="32" height="12" rx="6" fill="var(--amber)" stroke="var(--amber-deep)" stroke-width="2" transform="rotate(-18 94 78)"/>
      </g>
      <!-- arms: up (happy) -->
      <g class="mood mood-happy">
        <rect x="2" y="36" width="32" height="12" rx="6" fill="var(--amber)" stroke="var(--amber-deep)" stroke-width="2" transform="rotate(-55 18 42)"/>
        <rect x="86" y="36" width="32" height="12" rx="6" fill="var(--amber)" stroke="var(--amber-deep)" stroke-width="2" transform="rotate(55 102 42)"/>
      </g>

      <!-- eyes: neutral -->
      <g class="mood mood-neutral">
        <circle cx="45" cy="62" r="10" fill="#fff" stroke="#C9C0A0" stroke-width="1.5"/>
        <circle cx="75" cy="62" r="10" fill="#fff" stroke="#C9C0A0" stroke-width="1.5"/>
        <circle cx="45" cy="62" r="5.5" fill="#2B2100"/>
        <circle cx="75" cy="62" r="5.5" fill="#2B2100"/>
        <circle cx="47" cy="59.5" r="1.8" fill="#fff"/>
        <circle cx="77" cy="59.5" r="1.8" fill="#fff"/>
      </g>
      <!-- eyes: happy (closed curves) -->
      <g class="mood mood-happy">
        <path d="M36 62 Q45 50 54 62" stroke="#2B2100" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M66 62 Q75 50 84 62" stroke="#2B2100" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- eyes: sad -->
      <g class="mood mood-sad">
        <circle cx="45" cy="64" r="9" fill="#fff" stroke="#C9C0A0" stroke-width="1.5"/>
        <circle cx="75" cy="64" r="9" fill="#fff" stroke="#C9C0A0" stroke-width="1.5"/>
        <circle cx="45" cy="65" r="5" fill="#2B2100"/>
        <circle cx="75" cy="65" r="5" fill="#2B2100"/>
        <path d="M34 50 L54 56" stroke="#2B2100" stroke-width="4" stroke-linecap="round"/>
        <path d="M86 50 L66 56" stroke="#2B2100" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- mouth: neutral -->
      <path class="mood mood-neutral" d="M48 84 Q60 90 72 84" stroke="#2B2100" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- mouth: happy -->
      <path class="mood mood-happy" d="M42 82 Q60 108 78 82 Q60 96 42 82 Z" fill="#7A3B12"/>
      <!-- mouth: sad -->
      <path class="mood mood-sad" d="M46 94 Q60 84 74 94" stroke="#2B2100" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="banana-tray" id="bananaTray">
      <span class="empty-hint" id="bananaHint">정답을 맞히면 바나나가 쌓여요 🍌</span>
    </div>
  </div>

  <div class="panel diagram-panel">
    <svg id="wrenchSvg" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
      <!-- reference (dashed) line from the handle end -->
      <line id="refLine" x1="575.8" y1="166.4" x2="637" y2="160" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- pivot marker (O = bolt gripped by the jaw) -->
      <circle cx="212.8" cy="200.9" r="5" fill="var(--amber)"/>
      <text x="212.8" y="235" text-anchor="middle" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--ink)">O</text>

      <!-- length label + dimension line -->
      <line id="dimLine" x1="208.6" y1="157.1" x2="571.6" y2="122.6" stroke="var(--ink-soft)" stroke-width="1.2"/>
      <line id="dimTickO" x1="203.6" y1="151.1" x2="213.6" y2="163.1" stroke="var(--ink-soft)" stroke-width="1.2"/>
      <line id="dimTickP" x1="566.6" y1="116.6" x2="576.6" y2="128.6" stroke="var(--ink-soft)" stroke-width="1.2"/>
      <text id="lengthLabel" x="390" y="128" text-anchor="middle" font-family="var(--font-mono)" font-size="22" font-weight="700" fill="var(--ink)">20 cm</text>

      <!-- force vector (drawn dynamically) -->
      <line id="forceVec" x1="575.8" y1="166.4" x2="638" y2="115" stroke="var(--amber)" stroke-width="4" marker-end="url(#arrowhead)"/>
      <text id="forceLabel" x="590" y="95" font-family="var(--font-mono)" font-size="20" font-weight="700" fill="var(--amber-deep)">F = 10 N</text>

      <!-- angle arc -->
      <path id="angleArc" d="" fill="none" stroke="var(--ink-soft)" stroke-width="2"/>
      <text id="angleLabel" x="620" y="150" font-family="var(--font-mono)" font-size="18" font-weight="700" fill="var(--ink-soft)">30°</text>

      <defs>
        <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--amber)"/>
        </marker>
      </defs>
    </svg>
  </div>

  <div class="meter">
    <div class="cell">
      <span class="label">길이 L</span>
      <span class="value" id="mL">20<span class="unit">cm</span></span>
    </div>
    <div class="cell">
      <span class="label">힘 F</span>
      <span class="value" id="mF">10<span class="unit">N</span></span>
    </div>
    <div class="cell">
      <span class="label">각도 θ</span>
      <span class="value" id="mTheta">30<span class="unit">°</span></span>
    </div>
  </div>

  <div class="panel">
    <p class="input-hint">정수는 <b>3</b>, 루트가 들어간 답은 <b>2√3</b> 또는 <b>2*sqrt(3)</b> 처럼 입력하세요.</p>
    <div class="answer-row">
      <label class="answer-field">
        <input type="text" inputmode="text" id="answerInput" placeholder="예: 3 또는 2√3" autocomplete="off">
        <span class="suffix">N·m</span>
      </label>
      <button class="btn-check" id="checkBtn">확인</button>
    </div>

    <div class="result" id="resultBox">
      <div class="result-head">
        <span class="badge" id="resultBadge">-</span>
        <span class="answer-echo" id="resultEcho"></span>
      </div>
      <div class="steps" id="resultSteps"></div>
    </div>
  </div>

  <button class="btn-new" id="newBtn">새 문제</button>

  <footer>τ = F · L · sin θ</footer>
</div>

<script>
(function(){
  const LENGTHS = [20, 40, 60];                // cm (multiples of 20)
  const FORCES  = [10, 20, 30, 40, 50];        // N (multiples of 10)
  const ANGLES  = [30, 45, 60, 90];            // F×L is always divisible by 200 → clean integer / integer√ answers

  const SIN_INFO = {
    30: { decimal: 0.5,            surdCoeff: null, surdRoot: null, exactLabel: '1/2'  },
    45: { decimal: Math.SQRT2/2,   surdCoeff: 0.5,  surdRoot: 2,    exactLabel: '√2/2' },
    60: { decimal: Math.sqrt(3)/2, surdCoeff: 0.5,  surdRoot: 3,    exactLabel: '√3/2' },
    90: { decimal: 1,              surdCoeff: null, surdRoot: null, exactLabel: '1'    }
  };

  const els = {
    svgLength: document.getElementById('lengthLabel'),
    svgForce: document.getElementById('forceLabel'),
    svgAngle: document.getElementById('angleLabel'),
    forceVec: document.getElementById('forceVec'),
    angleArc: document.getElementById('angleArc'),
    mL: document.getElementById('mL'),
    mF: document.getElementById('mF'),
    mTheta: document.getElementById('mTheta'),
    input: document.getElementById('answerInput'),
    checkBtn: document.getElementById('checkBtn'),
    newBtn: document.getElementById('newBtn'),
    resultBox: document.getElementById('resultBox'),
    resultBadge: document.getElementById('resultBadge'),
    resultEcho: document.getElementById('resultEcho'),
    resultSteps: document.getElementById('resultSteps'),
    buddyFace: document.getElementById('buddyFace'),
    bananaTray: document.getElementById('bananaTray'),
    bananaHint: document.getElementById('bananaHint'),
  };

  let state = { L: 20, F: 10, theta: 30 };
  let bananaCount = 0;

  const BANANA_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M5 19c7 2 13-3 14-11 0.3-2.4-0.3-4-1.4-4.6-0.4 2.6-2 6.6-6 9.6-3 2.3-6 3.6-8 3.6-0.6 1-0.6 2 1.4 2.4Z" ' +
    'fill="var(--amber)" stroke="var(--amber-deep)" stroke-width="1.2" stroke-linejoin="round"/>' +
    '<path d="M17.5 3.6c0.8-0.4 1.6-0.5 2-0.3" stroke="var(--amber-deep)" stroke-width="1.2" fill="none" stroke-linecap="round"/>' +
    '</svg>';

  function setMood(mood){
    els.buddyFace.setAttribute('data-mood', mood);
  }

  function addBanana(){
    if(els.bananaHint) { els.bananaHint.remove(); els.bananaHint = null; }
    const b = document.createElement('div');
    b.className = 'banana';
    b.innerHTML = BANANA_SVG;
    els.bananaTray.appendChild(b);
    bananaCount++;
  }

  function removeBanana(){
    const last = els.bananaTray.querySelector('.banana:last-child');
    if(!last){ return; }
    bananaCount = Math.max(0, bananaCount - 1);
    last.style.animation = 'bananaOut 0.3s ease forwards';
    last.addEventListener('animationend', () => last.remove(), { once: true });
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function formatNum(n){
    const r = Math.round(n * 100) / 100;
    return Number.isInteger(r) ? String(r) : String(r).replace(/0+$/,'').replace(/\.$/,'');
  }

  // exact symbolic torque string. With this L/F pool, F×L is always a
  // multiple of 200, so the result is always a clean integer or an
  // integer coefficient times a root — e.g. "1", "2", "2√3", "√2".
  function exactTorqueLabel(L, F, theta){
    const info = SIN_INFO[theta];
    const base = F * (L/100); // F×L, rational, L in meters
    if(info.surdRoot === null){
      return String(Math.round(base * info.decimal));
    }
    const coeff = Math.round(base * info.surdCoeff);
    return (coeff === 1 ? '' : String(coeff)) + '√' + info.surdRoot;
  }

  function polar(cx, cy, r, deg){
    const rad = deg * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  }

  // O = bolt gripped by the jaw (pivot), P = point on the handle where force is applied.
  // Coordinates come from the actual photo, so the reference line follows the
  // real handle's tilt rather than assuming a perfectly horizontal wrench.
  const O = { x: 212.8, y: 200.9 };
  const P = { x: 575.8, y: 166.4 };
  const PHI = Math.atan2(O.y - P.y, P.x - O.x) * 180 / Math.PI; // handle direction, deg above horizontal

  function updateDiagram(){
    const dirDeg = PHI + state.theta; // force direction measured from the handle line

    const refEnd = polar(P.x, P.y, 65, PHI);
    document.getElementById('refLine').setAttribute('x2', refEnd.x.toFixed(1));
    document.getElementById('refLine').setAttribute('y2', refEnd.y.toFixed(1));

    const vec = polar(P.x, P.y, 88, dirDeg);
    els.forceVec.setAttribute('x1', P.x);
    els.forceVec.setAttribute('y1', P.y);
    els.forceVec.setAttribute('x2', vec.x.toFixed(1));
    els.forceVec.setAttribute('y2', vec.y.toFixed(1));

    // angle arc, swept from the handle direction to the force direction
    const r = 42;
    const start = polar(P.x, P.y, r, PHI);
    const end = polar(P.x, P.y, r, dirDeg);
    const largeArc = state.theta > 180 ? 1 : 0;
    els.angleArc.setAttribute('d', `M ${start.x.toFixed(1)} ${start.y.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${end.x.toFixed(1)} ${end.y.toFixed(1)}`);

    const angleLabelPt = polar(P.x, P.y, r + 26, PHI + state.theta / 2);
    document.getElementById('angleLabel').setAttribute('x', angleLabelPt.x.toFixed(1));
    document.getElementById('angleLabel').setAttribute('y', angleLabelPt.y.toFixed(1));
    document.getElementById('angleLabel').textContent = state.theta + '°';

    const forceLabelPt = polar(P.x, P.y, 108, dirDeg);
    els.svgForce.setAttribute('x', (forceLabelPt.x - 6).toFixed(1));
    els.svgForce.setAttribute('y', (forceLabelPt.y - 6).toFixed(1));
    els.svgForce.textContent = `F = ${state.F} N`;

    els.svgLength.textContent = `${state.L} cm`;
  }

  function newProblem(){
    state.L = pick(LENGTHS);
    state.F = pick(FORCES);
    state.theta = pick(ANGLES);

    els.mL.innerHTML = `${state.L}<span class="unit">cm</span>`;
    els.mF.innerHTML = `${state.F}<span class="unit">N</span>`;
    els.mTheta.innerHTML = `${state.theta}<span class="unit">°</span>`;

    updateDiagram();

    els.input.value = '';
    els.resultBox.classList.remove('show');
    setMood('neutral');
    els.input.focus({ preventScroll: true });
  }

  function checkAnswer(){
    const raw = els.input.value.trim();
    if(raw === ''){
      els.input.focus();
      return;
    }
    const info = SIN_INFO[state.theta];
    const torque = state.F * (state.L / 100) * info.decimal;

    // accept plain decimals, or surd forms like "2√3", "2*sqrt(3)", "sqrt(2)"
    let userVal = null;
    const cleaned = raw.replace(/\s/g, '').replace(',', '.');
    const surdMatch = cleaned.match(/^([\d.]*)(?:\*|×)?(?:√|sqrt)\(?(\d+)\)?$/i);
    if(surdMatch){
      const coeff = surdMatch[1] === '' ? 1 : parseFloat(surdMatch[1]);
      userVal = coeff * Math.sqrt(parseFloat(surdMatch[2]));
    } else if(/^-?[\d.]+$/.test(cleaned)){
      userVal = parseFloat(cleaned);
    }

    const exact = exactTorqueLabel(state.L, state.F, state.theta);
    const isCorrect = userVal !== null && Math.abs(userVal - torque) < 0.05;

    if(isCorrect){ setMood('happy'); addBanana(); }
    else{ setMood('sad'); removeBanana(); }

    els.resultBox.classList.add('show');
    els.resultBadge.textContent = isCorrect ? '정답' : '오답';
    els.resultBadge.className = 'badge ' + (isCorrect ? 'correct' : 'wrong');
    els.resultEcho.textContent = `정답: ${exact} N·m`;

    const Lm = formatNum(state.L / 100);
    els.resultSteps.innerHTML = `
      <span class="line">τ = F × L × sin θ</span>
      <span class="line">= ${state.F} N × ${Lm} m × sin ${state.theta}°</span>
      <span class="line">= ${state.F} × ${Lm} × ${info.exactLabel}</span>
      <span class="line final">= ${exact} N·m</span>
    `;

    els.resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  els.checkBtn.addEventListener('click', checkAnswer);
  els.input.addEventListener('keydown', (e) => { if(e.key === 'Enter') checkAnswer(); });
  els.newBtn.addEventListener('click', newProblem);

  newProblem();
})();
</script>
