<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스파이더맨 거미줄 원운동 챌린지</title>
<style>
:root{--bg:#0b0e1a;--card:#161b33;--red:#e62429;--blue:#2b5cff;--txt:#f2f4ff;--mute:#9aa3c7;--ok:#2ecc71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#1b2350,var(--bg) 60%);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px;text-align:center}
h1 span{color:var(--red)}
.sub{text-align:center;color:var(--mute);font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid #2a3263;border-radius:16px;padding:14px;margin-bottom:12px}
.q{font-size:16px;line-height:1.6}
.q b{color:#ffd54a}
svg{width:100%;height:auto;display:block;background:#0e1328;border-radius:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:13px 6px;border-radius:12px;border:2px solid #2a3263;background:#10152c;color:var(--txt);font-size:16px;font-weight:600}
.opt.sel{border-color:var(--blue);background:#1a2858}
.opt.right{border-color:var(--ok);background:#12382a}
.opt.wrong{border-color:var(--red);background:#40161a}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:#fff}
.b1{background:var(--blue)}.b2{background:var(--red)}
#res{display:none;line-height:1.7;font-size:14px}
#res h3{margin:0 0 6px;font-size:18px}
.eq{background:#0e1328;border-radius:8px;padding:8px 10px;margin:6px 0;font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>🕷️ 거미줄 <span>원운동</span> 챌린지</h1>
<div class="sub">스파이더맨이 도는 힘으로 A를 들어 올려라!</div>

<div class="card"><div class="q" id="q"></div></div>

<div class="card"><svg id="svg" viewBox="0 0 380 300"></svg></div>

<div class="card"><div class="opts" id="opts"></div></div>

<div class="btns">
<button class="btn b1" id="newBtn">새 문제</button>
<button class="btn b2" id="chkBtn">확인</button>
</div>

<div class="card" id="res" style="margin-top:12px"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=x=>String(+x.toFixed(2));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let P,sel=null,done=false,ang=0,last=0,raf,lastI=-1;

function newQ(){
  const g=10,SET=[[1,0.4,2],[2,0.4,4],[3,0.8,4]];
  let i;do{i=Math.floor(Math.random()*3)}while(i===lastI);lastI=i;
  const [mB,r,v]=SET[i],ans=mB*v*v/(r*g);
  const pool=[mB*v/(r*g),mB*v*v/r,ans*2,ans/2,mB*v*v*r/g,mB*v*v/(2*r*g),ans+1,ans+2];
  const set=[fmt(ans)];
  pool.forEach(x=>{const s=fmt(x);if(x>0&&isFinite(x)&&!set.includes(s)&&set.length<5)set.push(s)});
  let k=1;while(set.length<5){const s=fmt(ans+k*0.5);if(!set.includes(s))set.push(s);k++}
  set.sort(()=>Math.random()-.5);
  P={mB,r,v,g,ans:fmt(ans),opts:set};sel=null;done=false;
  $('res').style.display='none';
  $('q').innerHTML=`그림과 같이 물체 A와 거미줄로 연결된 스파이더맨 B가 마찰이 없는 수평면에서 반지름이 <b>${r} m</b>인 원궤도를 따라 <b>${v} m/s</b>의 속력으로 등속 원운동을 한다. B의 질량은 <b>${mB} kg</b>이다. A의 질량은? (단, 중력 가속도는 10 m/s²이고, 물체의 크기, 거미줄의 질량은 무시한다.)`;
  $('opts').innerHTML=set.map((x,i)=>`<button class="opt" data-i="${i}">${'①②③④⑤'[i]} ${x} kg</button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;sel=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
  build();
}

function build(){
  const cx=190,cy=105,rx=45+P.r*110,ry=rx*0.33;
  let web='';
  for(let i=1;i<=3;i++){web+=`<ellipse cx="${cx}" cy="${cy}" rx="${i*50}" ry="${i*17}" fill="none" stroke="#ffffff10"/>`}
  for(let a=0;a<12;a++){const t=a*Math.PI/6;web+=`<line x1="${cx}" y1="${cy}" x2="${cx+160*Math.cos(t)}" y2="${cy+54*Math.sin(t)}" stroke="#ffffff10"/>`}
  $('svg').innerHTML=`
  <polygon points="${cx-170},${cy+45} ${cx-120},${cy-65} ${cx+120},${cy-65} ${cx+170},${cy+45}" fill="#1c2550" stroke="#4a5aa8"/>
  <clipPath id="tb"><polygon points="${cx-170},${cy+45} ${cx-120},${cy-65} ${cx+120},${cy-65} ${cx+170},${cy+45}"/></clipPath>
  <g clip-path="url(#tb)">${web}</g>
  <rect x="${cx-160}" y="${cy+45}" width="8" height="120" fill="#4a5aa8"/>
  <rect x="${cx+152}" y="${cy+45}" width="8" height="120" fill="#4a5aa8"/>
  <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#9aa3c7" stroke-dasharray="5 4"/>
  <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy+95}" stroke="#fff" stroke-width="2.5"/>
  <rect x="${cx-16}" y="${cy+95}" width="32" height="26" rx="3" fill="#e62429" stroke="#fff"/>
  <text x="${cx}" y="${cy+113}" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">A</text>
  <text x="${cx+24}" y="${cy+112}" fill="#ffd54a" font-size="13">m = ?</text>
  <line id="web" x1="${cx}" y1="${cy}" x2="${cx+rx}" y2="${cy}" stroke="#fff" stroke-width="2.5"/>
  <circle cx="${cx}" cy="${cy}" r="3" fill="#111"/>

  <text id="Bl" fill="#ffd54a" font-size="12" text-anchor="middle">B ${P.mB}kg · ${P.v}m/s</text>
  <text x="${cx+rx/2}" y="${cy+16}" fill="#ffd54a" font-size="12" text-anchor="middle">r=${P.r}m</text>
  <text x="190" y="290" fill="#9aa3c7" font-size="12" text-anchor="middle">중력 가속도 g = 10 m/s²</text>`;
  cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(tick);
}

function tick(t){
  if(!last)last=t;
  const dt=(t-last)/1000;last=t;
  ang+=Math.min(P.v/P.r,12)*0.3*dt;
  const cx=190,cy=105,rx=45+P.r*110,ry=rx*0.33;
  const x=cx+rx*Math.cos(ang),y=cy+ry*Math.sin(ang);
  const B=$('B');if(!B)return;
  B.setAttribute('transform',`translate(${x},${y})`);
  const w=$('web');w.setAttribute('x2',x);w.setAttribute('y2',y);
  const l=$('Bl');l.setAttribute('x',x);l.setAttribute('y',y+(y>cy?34:-26));
  raf=requestAnimationFrame(tick);
}

function check(){
  if(sel===null){alert('보기를 먼저 선택하세요!');return}
  done=true;
  const {mB,r,v,g,ans,opts}=P,ok=opts[sel]===ans;
  document.querySelectorAll('.opt').forEach((b,i)=>{if(opts[i]===ans)b.classList.add('right');else if(i===sel)b.classList.add('wrong')});
  const T=fmt(mB*v*v/r);
  $('res').style.display='block';
  $('res').innerHTML=`<h3>${ok?'🎉 정답! 거미줄 장력 마스터!':'😵 아쉬워요! 다시 도전!'}</h3>
  <b>정답: ${'①②③④⑤'[opts.indexOf(ans)]} ${ans} kg</b>
  <div class="eq">① A는 정지 → 힘의 평형<br>거미줄 장력 T = m<sub>A</sub>·g = m<sub>A</sub> × ${g}</div>
  <div class="eq">② B는 등속 원운동 → 장력이 구심력<br>T = m<sub>B</sub>v²/r = ${mB} × ${v}² ÷ ${r} = ${T} N</div>
  <div class="eq">③ 두 식을 연결<br>m<sub>A</sub> × ${g} = ${T}<br>m<sub>A</sub> = ${ans} kg</div>
  <div style="color:#9aa3c7;font-size:12px">💡 같은 거미줄이므로 A를 당기는 장력과 B를 중심으로 당기는 구심력은 같아요.</div>`;
}
$('newBtn').onclick=newQ;$('chkBtn').onclick=check;
newQ();
</script>
